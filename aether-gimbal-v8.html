<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aether — Noble Gas Neon Kitty Gimbal</title>
  <style>
    :root {
      --page-bg: #070510;
      --card-bg: rgba(16, 12, 30, 0.78);
      --border: rgba(255, 59, 212, 0.22);
      --text: #f5f3ff;
      --muted: #a79ec9;
      --neon-pink: #ff3bd4;
      --neon-cyan: #22d3ee;
      --accent: #ff3bd4;
      --accent-glow: rgba(255, 59, 212, 0.42);
      --spring: cubic-bezier(0.22, 1.2, 0.36, 1);
      --silk: cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background:
        radial-gradient(820px 460px at 12% 0%, rgba(255, 59, 212, 0.12), transparent 60%),
        radial-gradient(760px 520px at 88% 100%, rgba(34, 211, 238, 0.11), transparent 60%),
        var(--page-bg);
      color: var(--text);
      line-height: 1.6;
      overflow-x: hidden;
    }

    .webpage { max-width: 790px; margin: 0 auto; padding: 36px 22px 160px; }

    .doc-header {
      display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center;
      gap: 12px; padding-bottom: 18px; margin-bottom: 18px; border-bottom: 1px solid var(--border);
    }
    .doc-header h1 {
      margin: 0; font-size: 1.35rem;
      background: linear-gradient(90deg, #ff7ce5, #22d3ee);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .doc-header p { margin: 4px 0 0; font-size: 0.84rem; color: var(--muted); }
    .header-actions { display: flex; gap: 8px; flex-wrap: wrap; }

    .pill-btn {
      background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.14);
      color: var(--text); padding: 7px 13px; border-radius: 999px; font-size: 0.78rem;
      cursor: pointer; transition: all 0.16s ease;
    }
    .pill-btn:hover { border-color: var(--neon-cyan); box-shadow: 0 0 14px rgba(34, 211, 238, 0.3); }
    .pill-btn.pink:hover { border-color: var(--neon-pink); box-shadow: 0 0 14px rgba(255, 59, 212, 0.35); }

    .mood-lab {
      background: rgba(255, 255, 255, 0.025); border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 16px; padding: 11px 14px; margin-bottom: 22px;
      display: flex; flex-wrap: wrap; align-items: center; gap: 7px;
    }
    .mood-lab-label {
      font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--neon-cyan); margin-right: 4px; font-weight: 700;
    }
    .mood-btn {
      background: rgba(168, 85, 247, 0.10); border: 1px solid rgba(255, 59, 212, 0.25);
      color: #ede9fe; padding: 5px 11px; border-radius: 999px; font-size: 0.75rem;
      cursor: pointer; transition: all 0.16s ease;
    }
    .mood-btn:hover, .mood-btn.active {
      background: rgba(255, 59, 212, 0.22); border-color: var(--neon-pink); color: #fff;
      box-shadow: 0 0 14px rgba(255, 59, 212, 0.35);
    }
    .mood-btn.play-seq {
      background: rgba(34, 211, 238, 0.14); border-color: rgba(34, 211, 238, 0.45);
      color: #cffafe; font-weight: 600;
    }

    .faq-article {
      background: var(--card-bg); border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 22px; padding: 28px; box-shadow: 0 20px 55px rgba(0, 0, 0, 0.4);
    }
    .sightline-crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 0.8rem; margin-bottom: 16px; }
    .crumb { padding: 3px 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); }
    .crumb.cat { border-color: var(--accent); color: var(--accent); font-weight: 600; }
    .faq-article h2 { margin: 0 0 14px; font-size: 1.55rem; line-height: 1.28; }
    .faq-article .answer { margin: 0 0 24px; font-size: 1.03rem; color: #d8d4eb; }
    .extra-context {
      padding: 14px 18px; border-radius: 14px; background: rgba(255, 255, 255, 0.025);
      border: 1px solid rgba(255, 255, 255, 0.08); font-size: 0.85rem; color: var(--muted); margin-bottom: 24px;
    }
    .sibling-title { font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 10px; }
    .sibling-list { display: flex; flex-direction: column; gap: 6px; }
    .sibling-btn {
      text-align: left; background: rgba(255, 255, 255, 0.025); border: 1px solid transparent;
      color: #c4bddf; padding: 10px 13px; border-radius: 12px; font-size: 0.88rem; cursor: pointer;
      display: flex; align-items: center; gap: 10px; transition: background 0.15s ease, border-color 0.15s ease;
    }
    .sibling-btn:hover { background: rgba(255, 255, 255, 0.06); color: #fff; }
    .sibling-btn.active { background: rgba(255, 59, 212, 0.12); border-color: rgba(255, 59, 212, 0.45); color: #fff; font-weight: 500; }
    .sibling-code { font-size: 0.73rem; font-weight: 700; color: var(--neon-cyan); min-width: 24px; }

    /* Magnetic Edge Glow Rails */
    .magnet-rail {
      position: fixed; z-index: 9990; pointer-events: none; opacity: 0; transition: opacity 0.18s ease;
      background: linear-gradient(90deg, var(--neon-pink), var(--neon-cyan));
      box-shadow: 0 0 24px 4px rgba(255, 59, 212, 0.55); border-radius: 999px;
    }
    .magnet-rail.active { opacity: 0.9; }
    .magnet-rail.left   { left: 0; top: 12vh; bottom: 12vh; width: 3px; }
    .magnet-rail.right  { right: 0; top: 12vh; bottom: 12vh; width: 3px; }
    .magnet-rail.top    { top: 0; left: 12vw; right: 12vw; height: 3px; }
    .magnet-rail.bottom { bottom: 0; left: 12vw; right: 12vw; height: 3px; }

    /* Floating Frosted-Glass Gimbal */
    .companion-root {
      position: fixed; z-index: 9999; user-select: none; touch-action: none; border-radius: 50%;
      transition: opacity 0.28s ease, transform 0.38s var(--spring), left 0.28s var(--spring), top 0.28s var(--spring);
      transform-origin: center center;
    }
    .companion-root.is-hidden { opacity: 0; pointer-events: none; transform: scale(0.24) rotate(-30deg); }
    .companion-root.dragging-window { transition: none; }

    .gimbal-glass-bg {
      position: absolute; inset: 3%; border-radius: 50%; pointer-events: none;
      background: radial-gradient(circle at 30% 25%, rgba(255, 59, 212, 0.08), rgba(10, 7, 22, 0.46) 65%, rgba(34, 211, 238, 0.08));
      backdrop-filter: blur(16px) saturate(140%); -webkit-backdrop-filter: blur(16px) saturate(140%);
      box-shadow: 0 18px 42px rgba(0, 0, 0, 0.55), 0 0 26px rgba(255, 59, 212, 0.16), inset 0 0 24px rgba(255, 255, 255, 0.05);
    }
    .gimbal-halo-wrap { position: relative; width: 100%; height: 100%; perspective: 900px; }
    .gimbal-tilt { width: 100%; height: 100%; transition: transform 0.16s ease-out; }
    svg.gimbal-svg { width: 100%; height: 100%; display: block; overflow: visible; }
    .ring-group { transform-origin: 230px 230px; transition: transform 0.56s var(--spring); }
    .upright-label { transition: transform 0.56s var(--spring); pointer-events: none; }
    .wedge { cursor: pointer; transition: fill 0.18s ease, stroke 0.18s ease, filter 0.18s ease; }
    .wedge:hover { filter: brightness(1.3); }
    .wedge.scrub-target { stroke: #facc15 !important; stroke-width: 1.8 !important; filter: brightness(1.35); }
    .label-main { fill: #f3e8ff; font-size: 10.5px; font-weight: 500; text-anchor: middle; dominant-baseline: central; }
    .label-sub { fill: #22d3ee; font-size: 8.5px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
    .chassis-grab { cursor: grab; transition: stroke 0.2s ease; }
    .chassis-grab:active { cursor: grabbing; }
    .chassis-grab:hover { stroke: var(--neon-pink); }

    .nub-btn {
      position: absolute; width: 26px; height: 26px; border-radius: 50%;
      background: rgba(14, 10, 28, 0.72); backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 59, 212, 0.4); color: var(--text);
      display: grid; place-items: center; font-size: 11px; cursor: pointer; opacity: 0.75;
      transition: opacity 0.18s ease, transform 0.18s ease, border-color 0.18s ease;
    }
    .companion-root:hover .nub-btn { opacity: 1; }
    .nub-btn:hover { border-color: var(--neon-cyan); transform: scale(1.12); }
    .nub-collapse { top: 6%; right: 6%; }
    .nub-resize   { bottom: 6%; right: 6%; cursor: nwse-resize; font-size: 12px; }

    .companion-whisper {
      position: absolute; left: 50%; bottom: -26px; transform: translateX(-50%);
      background: rgba(12, 8, 24, 0.85); backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 59, 212, 0.28); color: var(--muted);
      font-size: 11px; padding: 3px 10px; border-radius: 999px; white-space: nowrap;
      pointer-events: none; opacity: 0; transition: opacity 0.2s ease;
    }
    .companion-root:hover .companion-whisper,
    .companion-root.is-scrubbing .companion-whisper { opacity: 1; }

    /* Aether — Pure Transparent Frosted Kitty */
    .aether-orb {
      position: fixed; z-index: 9999; width: 86px; height: 86px; border-radius: 50%;
      cursor: grab; user-select: none; touch-action: none; overflow: visible;
      transition: transform 0.42s var(--spring), opacity 0.28s ease, left 0.42s var(--spring), top 0.42s var(--spring);
    }
    .aether-orb:active { cursor: grabbing; }
    .aether-orb.dragging-window { transition: none; }
    .aether-orb.is-hidden { opacity: 0; pointer-events: none; transform: scale(1.65); }

    .aether-frosted-lens {
      position: absolute; inset: 0; border-radius: 50%; pointer-events: none;
      background: radial-gradient(circle at 30% 25%, rgba(255, 59, 212, 0.13), rgba(14, 10, 28, 0.36) 60%, rgba(34, 211, 238, 0.11));
      backdrop-filter: blur(15px) saturate(145%); -webkit-backdrop-filter: blur(15px) saturate(145%);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4), 0 0 20px rgba(255, 59, 212, 0.22), 0 0 10px rgba(34, 211, 238, 0.18), inset 0 0 16px rgba(255, 255, 255, 0.08);
      transition: opacity 0.7s var(--silk), transform 0.7s var(--silk);
    }
    .aether-orb[data-stage="stretch"] .aether-frosted-lens,
    .aether-orb[data-stage="turning"] .aether-frosted-lens { opacity: 0.22; transform: scale(1.24); }

    .aether-orb:not(.dragging-window):not(.docked) .aether-stage-wrap {
      animation: aetherFloat 4.4s ease-in-out infinite;
    }
    @keyframes aetherFloat {
      0%, 100% { transform: translate(-50%, -50%) translateY(0px); }
      50%      { transform: translate(-50%, -50%) translateY(-3px); }
    }

    .aether-stage-wrap {
      position: absolute; left: 50%; top: 50%; width: 230px; height: 230px;
      transform: translate(-50%, -50%); pointer-events: none;
    }
    .aether-canvas { position: absolute; inset: 0; width: 230px; height: 230px; pointer-events: none; }
    .aether-svg {
      position: absolute; inset: 0; width: 230px; height: 230px; overflow: visible;
      filter: drop-shadow(0 0 6px rgba(255, 59, 212, 0.48)) drop-shadow(0 0 3px rgba(34, 211, 238, 0.38));
    }

    .aether-orb:not(.is-hidden).dock-right:hover  { transform: translateX(-36px) scale(1.05); }
    .aether-orb:not(.is-hidden).dock-left:hover   { transform: translateX(36px) scale(1.05); }
    .aether-orb:not(.is-hidden).dock-top:hover    { transform: translateY(36px) scale(1.05); }
    .aether-orb:not(.is-hidden).dock-bottom:hover { transform: translateY(-36px) scale(1.05); }

    #headEarsWhiskers { transform-origin: 100px 90px; transition: opacity 0.9s var(--silk), transform 1.0s var(--silk), filter 0.9s var(--silk); }
    #headNose { transition: opacity 0.8s var(--silk) 0s, transform 0.8s var(--silk) 0s; }
    #mouthRest { transform-origin: 100px 121px; transition: opacity 0.25s ease; animation: mouthSubtle 4.2s ease-in-out infinite; }
    #mouthYawn { transform-origin: 100px 122px; opacity: 0; transition: opacity 0.28s ease; }
    @keyframes mouthSubtle { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(0.86); } }

    #eyesOpen, #eyesHappy, #eyesClosed { transition: opacity 0.24s ease; }
    #eyesOpen { opacity: 1; } #eyesHappy { opacity: 0; } #eyesClosed { opacity: 0; }
    #eyesOpenBlink { transform-origin: 100px 99px; animation: felineBlink 4.6s infinite; }
    @keyframes felineBlink { 0%, 92%, 100% { transform: scaleY(1); } 95.5% { transform: scaleY(0.05); } }

    #kineticBodyLayer { opacity: 0; transition: opacity 0.45s var(--silk); }
    .aether-orb[data-stage="stretch"] #kineticBodyLayer,
    .aether-orb[data-stage="turning"] #kineticBodyLayer { opacity: 1; }

    .aether-orb[data-stage="stretch"] #eyesOpen,
    .aether-orb[data-stage="turning"] #eyesOpen { opacity: 0; }
    .aether-orb[data-stage="stretch"] #eyesHappy,
    .aether-orb[data-stage="turning"] #eyesHappy { opacity: 1; }
    .aether-orb[data-stage="stretch"] #mouthRest { opacity: 0; }
    .aether-orb[data-stage="stretch"] #mouthYawn { opacity: 1; }

    .aether-orb[data-stage="sleep"] #headEarsWhiskers { opacity: 0; transform: translate(12px, -8px) scale(1.06); filter: blur(2.5px); }
    .aether-orb[data-stage="sleep"] #mouthRest { opacity: 0; transform: translate(8px, -5px); transition: opacity 0.7s var(--silk) 0.15s, transform 0.8s var(--silk) 0.15s; }
    .aether-orb[data-stage="sleep"] #headNose { opacity: 0; transform: translate(7px, -5px); transition-delay: 0.85s; }
    .aether-orb[data-stage="sleep"] #eyesOpen { opacity: 0; }
    .aether-orb[data-stage="sleep"] #eyesClosed { opacity: 1; }

    #peekPaw { opacity: 0; transition: opacity 0.35s ease; }
    .aether-orb.docked #peekPaw { opacity: 0.85; }

    .aether-tip {
      position: absolute; bottom: calc(100% + 10px); left: 50%; transform: translateX(-50%);
      background: rgba(10, 6, 22, 0.92); backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 59, 212, 0.4); color: var(--text);
      font-size: 11px; padding: 4px 10px; border-radius: 999px; white-space: nowrap;
      pointer-events: none; opacity: 0; transition: opacity 0.18s ease;
    }
    .aether-orb.dock-top .aether-tip   { bottom: auto; top: calc(100% + 10px); }
    .aether-orb.dock-right .aether-tip { left: auto; right: 0; transform: none; }
    .aether-orb.dock-left .aether-tip  { left: 0; transform: none; }
    .aether-orb:hover .aether-tip      { opacity: 1; }
  </style>
</head>
<body>

  <main class="webpage">
    <header class="doc-header">
      <div>
        <h1>Aether — Noble Gas Neon Kitty</h1>
        <p>Matching winged closed eyes with eyelashes · Silky cubic-Bezier feline walk &amp; stretch · Transparent frosted glass</p>
      </div>
      <div class="header-actions">
        <button class="pill-btn pink" id="toggleFormBtn">✦ Toggle Kitty / Gimbal</button>
        <button class="pill-btn" id="resetPrefsBtn">↺ Reset Spot</button>
      </div>
    </header>

    <div class="mood-lab">
      <span class="mood-lab-label">Stages:</span>
      <button class="mood-btn" data-stage-btn="awake">1. Main / Awake</button>
      <button class="mood-btn" data-stage-btn="stretch">2. Yawn &amp; Stretch</button>
      <button class="mood-btn" data-stage-btn="turning">3. Step-Turn &amp; Curl</button>
      <button class="mood-btn" data-stage-btn="sleep">4. Dissipate to Sleep</button>
      <button class="mood-btn play-seq" id="playSeqBtn">▶ Watch 1 → 4 Cycle</button>
    </div>

    <article class="faq-article" aria-live="polite">
      <div class="sightline-crumbs" id="sightlineCrumbs"></div>
      <h2 id="questionTitle"></h2>
      <p class="answer" id="answerBody"></p>
      <div class="extra-context" id="extraContext"></div>
      <div class="sibling-title" id="siblingTitle"></div>
      <div class="sibling-list" id="siblingList"></div>
    </article>
  </main>

  <div class="magnet-rail left"   id="railLeft"></div>
  <div class="magnet-rail right"  id="railRight"></div>
  <div class="magnet-rail top"    id="railTop"></div>
  <div class="magnet-rail bottom" id="railBottom"></div>

  <!-- ==================== FLOATING FROSTED-GLASS GIMBAL ==================== -->
  <div class="companion-root" id="companionRoot" aria-label="Floating Gimbal Menu">
    <div class="gimbal-glass-bg"></div>
    <div class="gimbal-halo-wrap">
      <div class="gimbal-tilt" id="gimbalTilt">
        <svg class="gimbal-svg" id="gimbalSvg" viewBox="0 0 460 460">
          <defs>
            <filter id="gimbalNeon" x="-30%" y="-30%" width="160%" height="160%">
              <feGaussianBlur stdDeviation="2.2" result="blur" />
              <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
            </filter>
            <linearGradient id="sightBeam" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.42" />
              <stop offset="100%" stop-color="#ff3bd4" stop-opacity="0" />
            </linearGradient>
          </defs>
          <circle cx="230" cy="230" r="222" fill="none" stroke="rgba(255,59,212,0.45)" stroke-width="1.3" class="chassis-grab" filter="url(#gimbalNeon)" />
          <circle cx="230" cy="230" r="218" fill="none" stroke="rgba(34,211,238,0.18)" stroke-width="0.7" pointer-events="none" />
          <g id="bezelTicks" pointer-events="none"></g>
          <polygon points="216,18 244,18 234,185 226,185" fill="url(#sightBeam)" pointer-events="none" />
          <polygon points="230,22 225,12 235,12" fill="#22d3ee" pointer-events="none" />
          <g class="ring-group" id="ringOuter"></g>
          <g class="ring-group" id="ringMiddle"></g>
          <g class="ring-group" id="ringInner"></g>
          <g id="coreHub" style="cursor:pointer;" filter="url(#gimbalNeon)">
            <circle cx="230" cy="230" r="39" fill="rgba(12,8,24,0.62)" stroke="#ff3bd4" stroke-width="1.3" />
            <text x="230" y="223" class="label-main" style="font-size:9.5px; fill:#22d3ee;">SPIN</text>
            <text x="230" y="237" class="label-sub" id="coreCoord" style="font-size:8.5px; fill:#f5d0fe;">C1·T1·Q1</text>
          </g>
        </svg>
      </div>
      <button class="nub-btn nub-collapse" id="collapseBtn" title="Return to Aether (Right-Click / Pinch-In)">—</button>
      <div class="nub-btn nub-resize" id="resizeNub" title="Drag to resize (or Pinch)">⤢</div>
      <div class="companion-whisper">Drag rim to move · Right-click or pinch to summon Aether</div>
    </div>
  </div>

  <!-- ==================== AETHER — SMOOTH CUBIC-BEZIER NEON KITTY ==================== -->
  <div class="aether-orb is-hidden" id="aetherOrb" data-stage="awake" role="button" tabindex="0" aria-label="Aether the Neon Gimbal Kitty — Click to open menu">
    <div class="aether-frosted-lens"></div>
    <div class="aether-stage-wrap">
      <canvas class="aether-canvas" id="aetherCanvas" width="230" height="230"></canvas>
      <svg class="aether-svg" viewBox="0 0 200 200">
        <defs>
          <filter id="neonTube" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="2.1" result="b1" />
            <feGaussianBlur stdDeviation="4.6" result="b2" />
            <feMerge><feMergeNode in="b2" /><feMergeNode in="b1" /><feMergeNode in="SourceGraphic" /></feMerge>
          </filter>
          <mask id="occludeBehindHead" maskUnits="userSpaceOnUse" x="-120" y="-120" width="440" height="440">
            <rect x="-120" y="-120" width="440" height="440" fill="white" />
            <circle id="headMaskHole" cx="100" cy="100" r="37.5" fill="black" />
          </mask>
          <clipPath id="leftEyeClip">
            <path d="M 90 110 C 79 110, 67 104, 60 95 C 56 91, 54 87, 55 85 C 57 87, 60 88, 63 89 C 61 86, 61 84, 62 83 C 64 86, 67 88, 70 89 C 80 92, 87 100, 90 110 Z" />
          </clipPath>
          <clipPath id="rightEyeClip">
            <path d="M 110 110 C 121 110, 133 104, 140 95 C 144 91, 146 87, 145 85 C 143 87, 140 88, 137 89 C 139 86, 139 84, 138 83 C 136 86, 133 88, 130 89 C 120 92, 113 100, 110 110 Z" />
          </clipPath>
        </defs>

        <g filter="url(#neonTube)" stroke-linecap="round" stroke-linejoin="round" fill="none">
          <!-- KINETIC BODY LAYER (100% Organic Cubic Bezier Splines, Masked Behind Head) -->
          <g id="kineticBodyLayer" mask="url(#occludeBehindHead)">
            <path id="pathLegFrontFar"  stroke="#ff3bd4" stroke-width="1.35" opacity="0.78" />
            <path id="pathLegHindFar"   stroke="#ff3bd4" stroke-width="1.35" opacity="0.78" />
            <path id="pathTail"         stroke="#ff3bd4" stroke-width="1.5" />
            <path id="pathTailCyan"     stroke="#22d3ee" stroke-width="1.0" opacity="0.7" />
            <path id="pathSpine"        stroke="#ff3bd4" stroke-width="1.55" />
            <path id="pathChestBelly"   stroke="#ff3bd4" stroke-width="1.5" />
            <path id="pathLegFrontNear" stroke="#ff3bd4" stroke-width="1.55" />
            <path id="pathLegHindNear"  stroke="#ff3bd4" stroke-width="1.55" />
            <g id="breathWisps" stroke="#22d3ee" stroke-width="1.15" opacity="0">
              <line x1="30" y1="104" x2="21" y2="100" />
              <line x1="28" y1="110" x2="18" y2="110" />
              <line x1="30" y1="116" x2="22" y2="120" />
            </g>
          </g>

          <!-- UNIFIED KITTY HEAD RIG (100% Transparent Interior!) -->
          <g id="aetherHead">
            <circle id="headCircle" cx="100" cy="100" r="38" stroke="#ff3bd4" stroke-width="1.6" />

            <g id="headEarsWhiskers">

      legFN: [84,125, 83,134, 81,142, 77,146, 73,148, 78,150, 85,148, 89,141, 91,133, 94,125],
      // Far front leg: lifted & softly curled at wrist
      legFF: [88,124, 84,131, 81,136, 82,141, 83,144, 88,144, 90,140, 92,135, 94,130, 96,124],
      // Near hind leg: stepping gently back
      legHN: [128,123, 130,132, 134,139, 132,146, 128,148, 133,150, 139,148, 142,139, 148,131, 150,118],
      // Far hind leg: stepping gently forward
      legHF: [152,106, 154,119, 146,129, 138,136, 134,142, 134,148, 140,148, 146,144, 152,126, 152,106],
      tail:  [150,99, 166,95, 173,73, 166,55, 161,42, 148,40, 141,49],
      tailC: [152,95, 164,89, 169,71, 164,55]
    };

    // Pose 3: Smoothly folded legs & curled down to lie back down (GIF 2 & 4 inspired!)
    const CURL_DOWN = {
      head: [-20, 18, 0.65, 8],
      spine: [90,104, 104,102, 124,102, 138,108, 148,113, 154,122, 152,134],
      belly: [78,134, 82,142, 92,144, 104,144, 118,144, 132,144, 142,142],
      // Softly tucked curved front paw
      legFN: [84,132, 76,136, 70,140, 72,144, 74,147, 82,147, 88,145, 94,143, 96,138, 96,134],
      legFF: [88,134, 82,138, 78,141, 80,144, 82,146, 88,146, 92,144, 96,142, 98,138, 98,134],
      // Cozy folded haunch resting on ground
      legHN: [122,134, 116,138, 114,143, 118,146, 122,148, 132,148, 138,145, 144,141, 148,134, 146,124],
      legHF: [148,124, 152,132, 150,140, 144,144, 140,146, 144,148, 149,146, 153,142, 155,133, 152,126],
      // Tail wraps gracefully forward around her cozy side
      tail:  [152,134, 158,144, 148,151, 132,150, 118,149, 108,148, 100,145],
      tailC: [150,136, 153,144, 144,149, 130,148]
    };

    const gasParticles = [];
    function spawnGasBurst(kind) {
      const count = kind === "dissipate" ? 38 : kind === "nose" ? 12 : 24;
      for (let i = 0; i < count; i++) {
        const color = Math.random() < 0.42 ? "34, 211, 238" : "255, 59, 212";
        let x = 115, y = 115, vx = 0, vy = 0;
        if (kind === "nose") {
          x = 115 + (Math.random() - 0.5) * 6; y = 130 + (Math.random() - 0.5) * 4;
          vx = 0.35 + Math.random() * 0.55; vy = -0.25 - Math.random() * 0.45;
        } else if (kind === "dissipate") {
          const a = Math.random() * Math.PI * 2, r = 28 + Math.random() * 38;
          x = 115 + Math.cos(a) * r; y = 115 + Math.sin(a) * r;
          vx = 0.34 + Math.random() * 0.78; vy = -0.22 - Math.random() * 0.65;
        } else {
          const a = Math.random() * Math.PI * 2, r = 64 + Math.random() * 24;
          x = 115 + Math.cos(a) * r; y = 115 + Math.sin(a) * r;
          vx = -Math.cos(a) * (0.65 + Math.random() * 0.5); vy = -Math.sin(a) * (0.65 + Math.random() * 0.5);
        }
        gasParticles.push({
          x, y, vx, vy, r: (kind === "dissipate" ? 1.6 : 1.3) + Math.random() * 2.2,
          alpha: 0.85, decay: 0.011 + Math.random() * 0.011, wobble: Math.random() * Math.PI * 2, color
        });
      }
    }

    const gazeTarget = { x: 0, y: 0 };
    const gazeCurrent = { x: 0, y: 0 };
    let lastGazeInputAt = performance.now();

    function aimGazeAt(clientX, clientY) {
      lastGazeInputAt = performance.now();
      const rect = aetherOrb.getBoundingClientRect();
      const orbCx = rect.left + rect.width / 2, orbCy = rect.top + rect.height / 2;
      const dx = clientX - orbCx, dy = clientY - orbCy, dist = Math.hypot(dx, dy);
      if (dist < 4) { gazeTarget.x = 0; gazeTarget.y = 0; }
      else {
        const s = Math.min(1, dist / 220);
        gazeTarget.x = (dx / dist) * 7.8 * s;
        gazeTarget.y = (dy / dist) * 5.5 * s;
      }
    }

    const headAnim = { x: 0, y: 0, scale: 1, rot: 0 };
    let stageEnteredAt = performance.now();

    function applyBodyBlend(poseA, poseB, t) {
      pathSpine.setAttribute("d",        lerpBezierPath(poseA.spine, poseB.spine, t));
      pathChestBelly.setAttribute("d",   lerpBezierPath(poseA.belly, poseB.belly, t));
      pathLegFrontNear.setAttribute("d", lerpBezierPath(poseA.legFN, poseB.legFN, t));
      pathLegFrontFar.setAttribute("d",  lerpBezierPath(poseA.legFF, poseB.legFF, t));
      pathLegHindNear.setAttribute("d",  lerpBezierPath(poseA.legHN, poseB.legHN, t));
      pathLegHindFar.setAttribute("d",   lerpBezierPath(poseA.legHF, poseB.legHF, t));
      pathTail.setAttribute("d",         lerpBezierPath(poseA.tail,  poseB.tail,  t));
      pathTailCyan.setAttribute("d",     lerpBezierPath(poseA.tailC, poseB.tailC, t));
      return {
        tx: lerp(poseA.head[0], poseB.head[0], t),
        ty: lerp(poseA.head[1], poseB.head[1], t),
        ts: lerp(poseA.head[2], poseB.head[2], t),
        tr: lerp(poseA.head[3], poseB.head[3], t)
      };
    }

    function renderKineticFrame(now) {
      ctx.clearRect(0, 0, 230, 230);
      const stage = aetherOrb.getAttribute("data-stage");

      if (state.collapsed && stage === "sleep" && Math.random() < 0.12) {
        const angle = -0.7 + Math.random() * 1.4;
        gasParticles.push({
          x: 115 + Math.cos(angle) * 42, y: 115 + Math.sin(angle) * 42,
          vx: 0.28 + Math.random() * 0.35, vy: -0.18 - Math.random() * 0.25,
          r: 1.4 + Math.random() * 1.6, alpha: 0.55, decay: 0.008,
          wobble: Math.random() * Math.PI * 2, color: Math.random() < 0.5 ? "34, 211, 238" : "255, 59, 212"
        });
      }

      for (let i = gasParticles.length - 1; i >= 0; i--) {
        const p = gasParticles[i];
        p.wobble += 0.08;
        p.x += p.vx + Math.sin(p.wobble) * 0.16;
        p.y += p.vy + Math.cos(p.wobble * 0.8) * 0.12;
        p.alpha -= p.decay;
        if (p.alpha <= 0) { gasParticles.splice(i, 1); continue; }
        const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 3.2);
        grad.addColorStop(0, `rgba(${p.color}, ${p.alpha.toFixed(2)})`);
        grad.addColorStop(0.5, `rgba(${p.color}, ${(p.alpha * 0.35).toFixed(2)})`);
        grad.addColorStop(1, `rgba(${p.color}, 0)`);
        ctx.fillStyle = grad;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 3.2, 0, Math.PI * 2); ctx.fill();
      }

      if (now - lastGazeInputAt > 7000 && stage === "awake") {
        gazeTarget.x = lerp(gazeTarget.x, 0, 0.015);
        gazeTarget.y = lerp(gazeTarget.y, 0, 0.015);
      }
      gazeCurrent.x = lerp(gazeCurrent.x, gazeTarget.x, 0.18);
      gazeCurrent.y = lerp(gazeCurrent.y, gazeTarget.y, 0.18);
      const irisTx = `translate(${gazeCurrent.x.toFixed(2)} ${gazeCurrent.y.toFixed(2)})`;
      irisLeft.setAttribute("transform", irisTx);
      irisRight.setAttribute("transform", irisTx);

      const elapsed = (now - stageEnteredAt) / 1000;
      let targetHead = { tx: 0, ty: 0, ts: 1, tr: 0 };

      if (stage === "stretch") {
        const loop = (elapsed % 3.8) / 3.8;
        const reach = 0.5 - 0.5 * Math.cos(loop * Math.PI * 2);
        const yawnAmt = clamp(Math.sin(clamp((loop - 0.2) / 0.58, 0, 1) * Math.PI), 0, 1);
        targetHead = applyBodyBlend(STRETCH_A, STRETCH_B, reach);
        yawnOval.setAttribute("rx", (2.6 + 1.8 * yawnAmt).toFixed(2));
        yawnOval.setAttribute("ry", (1.6 + 3.8 * yawnAmt).toFixed(2));
        breathWisps.setAttribute("opacity", (yawnAmt * 0.9).toFixed(2));
      } else if (stage === "turning") {
        breathWisps.setAttribute("opacity", "0");
        const cycle = (elapsed % 4.6) / 4.6;
        if (cycle < 0.62) {
          // Smooth walk cycle between organic black-cat poses!
          const walkBlend = 0.5 - 0.5 * Math.cos((cycle / 0.62) * Math.PI * 4);
          targetHead = applyBodyBlend(WALK_A, WALK_B, walkBlend);
        } else {
          // Smoothly curl & lie down from the current walk pose
          const lieT = clamp((cycle - 0.62) / 0.3, 0, 1);
          const lieEase = lieT * lieT * (3 - 2 * lieT);
          targetHead = applyBodyBlend(WALK_A, CURL_DOWN, lieEase);
        }
      } else {
        breathWisps.setAttribute("opacity", "0");
      }

      headAnim.x     = lerp(headAnim.x, targetHead.tx, 0.14);
      headAnim.y     = lerp(headAnim.y, targetHead.ty, 0.14);
      headAnim.scale = lerp(headAnim.scale, targetHead.ts, 0.14);
      headAnim.rot   = lerp(headAnim.rot, targetHead.tr, 0.14);

      const cx = 100 + headAnim.x, cy = 100 + headAnim.y;
      aetherHead.setAttribute("transform",
        `translate(${cx.toFixed(2)} ${cy.toFixed(2)}) rotate(${headAnim.rot.toFixed(2)}) scale(${headAnim.scale.toFixed(4)}) translate(-100 -100)`
      );
      headMaskHole.setAttribute("cx", cx.toFixed(2));
      headMaskHole.setAttribute("cy", cy.toFixed(2));
      headMaskHole.setAttribute("r", (37.6 * headAnim.scale).toFixed(2));

      requestAnimationFrame(renderKineticFrame);
    }
    requestAnimationFrame(renderKineticFrame);

    // =========================================================================
    // 4. AETHER CHOREOGRAPHY TRIGGERS
    // =========================================================================
    let stageTimers = [];
    let lastInteractionTime = Date.now();
    let autoSequenceLock = false;

    function clearStageTimers() { stageTimers.forEach(t => clearTimeout(t)); stageTimers = []; }

    function setAetherStage(stageName) {
      const prev = aetherOrb.getAttribute("data-stage");
      if (prev !== stageName) stageEnteredAt = performance.now();
      aetherOrb.setAttribute("data-stage", stageName);
      document.querySelectorAll("[data-stage-btn]").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.stageBtn === stageName);
      });
      if (stageName === "sleep" && prev !== "sleep") {
        spawnGasBurst("dissipate");
        stageTimers.push(setTimeout(() => {
          if (aetherOrb.getAttribute("data-stage") === "sleep") spawnGasBurst("nose");
        }, 850));
      } else if (stageName === "awake" && prev !== "awake") {
        spawnGasBurst("condense");
      }
    }

    function playFullCycle() {
      clearStageTimers();
      autoSequenceLock = true;
      if (!state.collapsed) setCollapsed(true);
      setAetherStage("awake");
      stageTimers.push(setTimeout(() => setAetherStage("stretch"), 1400));
      stageTimers.push(setTimeout(() => setAetherStage("turning"), 5300));
      stageTimers.push(setTimeout(() => { setAetherStage("sleep"); autoSequenceLock = false; }, 9900));
    }

    setInterval(() => {
      if (!state.collapsed || mode || autoSequenceLock) return;
      const idleSec = (Date.now() - lastInteractionTime) / 1000;
      if (idleSec > 16 && aetherOrb.getAttribute("data-stage") === "awake") {
        autoSequenceLock = true;
        setAetherStage("stretch");
        stageTimers.push(setTimeout(() => { if (state.collapsed && !mode) setAetherStage("turning"); }, 3900));
        stageTimers.push(setTimeout(() => { if (state.collapsed && !mode) setAetherStage("sleep"); autoSequenceLock = false; }, 8500));
      }
    }, 3000);

    document.querySelectorAll("[data-stage-btn]").forEach(btn => {
      btn.addEventListener("click", () => {
        clearStageTimers(); autoSequenceLock = false; lastInteractionTime = Date.now();
        if (!state.collapsed) setCollapsed(true);
        setAetherStage(btn.dataset.stageBtn);
      });
    });

    document.getElementById("playSeqBtn").addEventListener("click", () => {
      lastInteractionTime = Date.now(); playFullCycle();
    });

    function applyCompanionGeometry() {
      const margin = 12;
      if (!state.collapsed) {
        const half = state.size / 2;
        const clampedCx = clamp(state.cx, half + margin, window.innerWidth - half - margin);
        const clampedCy = clamp(state.cy, half + margin, window.innerHeight - half - margin);
        companionRoot.style.width = `${state.size}px`; companionRoot.style.height = `${state.size}px`;
        companionRoot.style.left = `${clampedCx - half}px`; companionRoot.style.top = `${clampedCy - half}px`;
      } else {
        aetherOrb.classList.remove("docked", "dock-left", "dock-right", "dock-top", "dock-bottom");
        if (state.dockEdge) {
          aetherOrb.classList.add("docked", `dock-${state.dockEdge}`);
          const tucked = ORB_SIZE - PEEK_VISIBLE;
          if (state.dockEdge === "left") {
            state.cy = clamp(state.cy, ORB_HALF + margin, window.innerHeight - ORB_HALF - margin);
            aetherOrb.style.left = `${-tucked}px`; aetherOrb.style.top = `${state.cy - ORB_HALF}px`;
          } else if (state.dockEdge === "right") {
            state.cy = clamp(state.cy, ORB_HALF + margin, window.innerHeight - ORB_HALF - margin);
            aetherOrb.style.left = `${window.innerWidth - PEEK_VISIBLE}px`; aetherOrb.style.top = `${state.cy - ORB_HALF}px`;
          } else if (state.dockEdge === "top") {
            state.cx = clamp(state.cx, ORB_HALF + margin, window.innerWidth - ORB_HALF - margin);
            aetherOrb.style.left = `${state.cx - ORB_HALF}px`; aetherOrb.style.top = `${-tucked}px`;
          } else if (state.dockEdge === "bottom") {
            state.cx = clamp(state.cx, ORB_HALF + margin, window.innerWidth - ORB_HALF - margin);
            aetherOrb.style.left = `${state.cx - ORB_HALF}px`; aetherOrb.style.top = `${window.innerHeight - PEEK_VISIBLE}px`;
          }
        } else {
          state.cx = clamp(state.cx, ORB_HALF + margin, window.innerWidth - ORB_HALF - margin);
          state.cy = clamp(state.cy, ORB_HALF + margin, window.innerHeight - ORB_HALF - margin);
          aetherOrb.style.left = `${state.cx - ORB_HALF}px`; aetherOrb.style.top = `${state.cy - ORB_HALF}px`;
        }
      }
    }

    function setCollapsed(shouldCollapse) {
      clearStageTimers(); autoSequenceLock = false; lastInteractionTime = Date.now();
      state.collapsed = shouldCollapse;
      if (shouldCollapse) {
        companionRoot.classList.add("is-hidden"); aetherOrb.classList.remove("is-hidden");
        setAetherStage("awake"); spawnGasBurst("condense");
      } else {
        aetherOrb.classList.add("is-hidden"); companionRoot.classList.remove("is-hidden");
      }
      applyCompanionGeometry(); saveState();
    }

    // =========================================================================
    // 5. SVG GIMBAL GEOMETRY & RENDERING
    // =========================================================================
    function shortestAngle(current, targetIdx, count) {
      const step = 360 / count, targetMod = -targetIdx * step;
      return current + (((targetMod - current) % 360 + 540) % 360 - 180);
    }

    function polarToXY(cx, cy, r, degFromTop) {
      const rad = (degFromTop - 90) * Math.PI / 180;
      return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
    }

    function describeWedge(cx, cy, rIn, rOut, startDeg, endDeg) {
      const p1 = polarToXY(cx, cy, rOut, startDeg), p2 = polarToXY(cx, cy, rOut, endDeg);
      const p3 = polarToXY(cx, cy, rIn, endDeg),   p4 = polarToXY(cx, cy, rIn, startDeg);
      const largeArc = (endDeg - startDeg) > 180 ? 1 : 0;
      return `M ${p1.x.toFixed(2)} ${p1.y.toFixed(2)} A ${rOut} ${rOut} 0 ${largeArc} 1 ${p2.x.toFixed(2)} ${p2.y.toFixed(2)} L ${p3.x.toFixed(2)} ${p3.y.toFixed(2)} A ${rIn} ${rIn} 0 ${largeArc} 0 ${p4.x.toFixed(2)} ${p4.y.toFixed(2)} Z`;
    }

    function svgEl(tag, attrs = {}) {
      const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
      for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
      return el;
    }

    const bezelTicks = document.getElementById("bezelTicks");
    for (let d = 0; d < 360; d += 6) {
      const major = d % 30 === 0;
      const p1 = polarToXY(CX, CY, major ? 206 : 209, d), p2 = polarToXY(CX, CY, 214, d);
      bezelTicks.appendChild(svgEl("line", {
        x1: p1.x, y1: p1.y, x2: p2.x, y2: p2.y,
        stroke: major ? "rgba(255,59,212,0.45)" : "rgba(34,211,238,0.16)",
        "stroke-width": major ? 1.1 : 0.7
      }));
    }

    const ringOuterEl = document.getElementById("ringOuter");
    const ringMiddleEl = document.getElementById("ringMiddle");
    const ringInnerEl = document.getElementById("ringInner");

    function renderRing(container, ringKey, items, activeIdx, previewIdx, ringRot, fillBase, accentColor) {
      const { rIn, rOut, gap, count } = RINGS[ringKey];
      const step = 360 / count;
      container.innerHTML = "";
      container.style.transform = `rotate(${ringRot}deg)`;

      items.forEach((item, idx) => {
        const midDeg = idx * step, startDeg = midDeg - step / 2 + gap / 2, endDeg = midDeg + step / 2 - gap / 2;
        const isSelected = idx === activeIdx, isScrub = idx === previewIdx;
        container.appendChild(svgEl("path", {
          d: describeWedge(CX, CY, rIn, rOut, startDeg, endDeg),
          class: `wedge ${isSelected ? "active" : ""} ${isScrub ? "scrub-target" : ""}`,
          fill: isSelected ? `${accentColor}26` : fillBase,
          stroke: isSelected ? accentColor : "rgba(255,255,255,0.12)",
          "stroke-width": isSelected ? 1.4 : 0.8
        }));

        const labelPos = polarToXY(CX, CY, (rIn + rOut) / 2, midDeg);
        const labelGroup = svgEl("g", {
          class: "upright-label",
          style: `transform: rotate(${-ringRot}deg); transform-origin: ${labelPos.x}px ${labelPos.y}px;`
        });

        if (ringKey === "inner") {
          const t1 = svgEl("text", { x: labelPos.x, y: labelPos.y - 5, class: "label-sub", style: `fill:${accentColor};` });
          t1.textContent = `Q${idx + 1}`;
          const t2 = svgEl("text", { x: labelPos.x, y: labelPos.y + 6, class: "label-main", style: "font-size:9.2px;" });
          t2.textContent = item.short;
          labelGroup.append(t1, t2);
        } else {
          const t = svgEl("text", { x: labelPos.x, y: labelPos.y, class: "label-main" });
          t.textContent = item.name;
          labelGroup.appendChild(t);
        }
        container.appendChild(labelGroup);
      });
    }

    function updateUI(preview = null) {
      const viewCat = preview ? preview.cat : state.cat;
      const viewTopic = preview ? preview.topic : state.topic;
      const viewQ = preview ? preview.q : state.q;
      const catObj = FAQ_DATA[viewCat], topicObj = catObj.topics[viewTopic], qObj = topicObj.questions[viewQ];

      document.documentElement.style.setProperty("--accent", catObj.color);
      document.documentElement.style.setProperty("--accent-glow", `${catObj.color}66`);

      renderRing(ringOuterEl,  "outer",  FAQ_DATA,           state.cat,   preview ? preview.cat   : -1, state.rot.outer,  "rgba(23,15,46,0.34)", catObj.color);
      renderRing(ringMiddleEl, "middle", catObj.topics,      state.topic, preview ? preview.topic : -1, state.rot.middle, "rgba(18,12,38,0.34)", catObj.color);
      renderRing(ringInnerEl,  "inner",  topicObj.questions, state.q,     preview ? preview.q     : -1, state.rot.inner,  "rgba(13,8,28,0.38)",  catObj.color);

      document.getElementById("coreCoord").textContent = `C${viewCat + 1}·T${viewTopic + 1}·Q${viewQ + 1}`;
      document.getElementById("aetherTip").textContent = `Aether · ${catObj.name} › ${topicObj.name} › Q${viewQ + 1}`;
      document.getElementById("sightlineCrumbs").innerHTML = `
        <span class="crumb cat">${catObj.name}</span><span>›</span>
        <span class="crumb">${topicObj.name}</span><span>›</span>
        <span class="crumb">Question ${viewQ + 1} of 5</span>`;
      document.getElementById("questionTitle").textContent = qObj.q;
      document.getElementById("answerBody").textContent = qObj.a;
      document.getElementById("extraContext").textContent =
        `Coordinate lock [C${viewCat + 1} · T${viewTopic + 1} · Q${viewQ + 1}] — Tap anywhere to watch Aether's transparent irises follow your last touch, or hit "4. Dissipate to Sleep" to see her closed winged eyelashes!`;

      document.getElementById("siblingTitle").textContent = `${catObj.name} / ${topicObj.name} — All 5 Questions`;
      const siblingList = document.getElementById("siblingList");
      siblingList.innerHTML = "";
      topicObj.questions.forEach((item, idx) => {
        const btn = document.createElement("button");
        btn.className = `sibling-btn ${idx === viewQ ? "active" : ""}`;
        btn.innerHTML = `<span class="sibling-code">Q${idx + 1}</span><span>${item.q}</span>`;
        btn.onclick = () => commitSelection(viewCat, viewTopic, idx);
        siblingList.appendChild(btn);
      });
    }

    function commitSelection(catIdx, topicIdx, qIdx) {
      state.cat = catIdx; state.topic = topicIdx; state.q = qIdx;
      state.rot.outer  = shortestAngle(state.rot.outer,  catIdx,   5);
      state.rot.middle = shortestAngle(state.rot.middle, topicIdx, 3);
      state.rot.inner  = shortestAngle(state.rot.inner,  qIdx,     5);
      updateUI(); saveState();
    }

    // =========================================================================
    // 6. INTERACTIONS: SCRUB, MOVE, RESIZE, PINCH, FLICK-DOCK, GAZE
    // =========================================================================
    const activePointers = new Map();
    let pinchState = null, mode = null, dragCtx = {};

    function pointerToPolar(clientX, clientY) {
      const rect = gimbalSvg.getBoundingClientRect(), scale = VIEWBOX_SIZE / rect.width;
      const x = (clientX - rect.left) * scale - CX, y = (clientY - rect.top) * scale - CY;
      return { r: Math.hypot(x, y), deg: ((Math.atan2(y, x) * 180 / Math.PI) + 90 + 360) % 360 };
    }

    function hitTestRing(r, deg) {
      let ringKey = null;
      if (r >= 150 && r <= 204) ringKey = "outer";
      else if (r >= 98 && r < 150) ringKey = "middle";
      else if (r >= 44 && r < 98) ringKey = "inner";
      if (!ringKey) return null;
      const { count } = RINGS[ringKey], step = 360 / count;
      const localDeg = ((deg - state.rot[ringKey]) % 360 + 360) % 360;
      return { ringKey, idx: Math.round(localDeg / step) % count };
    }

    function startPinchIfTwoPointers() {
      if (activePointers.size !== 2) return false;
      const pts = [...activePointers.values()];
      mode = "pinch";
      companionRoot.classList.remove("is-scrubbing", "dragging-window");
      aetherOrb.classList.remove("dragging-window");
      highlightRail(null);
      pinchState = { startDist: Math.max(Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y), 10), startSize: state.size, triggered: false };
      return true;
    }

    function detectMagneticEdge(cx, cy, vx = 0, vy = 0) {
      const dLeft = cx - ORB_HALF, dRight = window.innerWidth - (cx + ORB_HALF);
      const dTop = cy - ORB_HALF, dBottom = window.innerHeight - (cy + ORB_HALF);
      if (Math.hypot(vx, vy) > 0.52) {
        if (vx < -0.42 && dLeft < 145) return "left";
        if (vx >  0.42 && dRight < 145) return "right";
        if (vy < -0.42 && dTop < 145) return "top";
        if (vy >  0.42 && dBottom < 145) return "bottom";
      }
      const hits = [
        { edge: "left", d: dLeft }, { edge: "right", d: dRight },
        { edge: "top", d: dTop },   { edge: "bottom", d: dBottom }
      ].filter(c => c.d <= MAGNET_THRESHOLD);
      return hits.length ? hits.sort((a, b) => a.d - b.d)[0].edge : null;
    }

    companionRoot.addEventListener("pointerdown", (e) => {
      if (e.button === 2) return;
      activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (startPinchIfTwoPointers() || e.target.closest("#collapseBtn")) return;

      if (e.target.closest("#resizeNub")) {
        mode = "resize"; companionRoot.setPointerCapture(e.pointerId); companionRoot.classList.add("dragging-window");
        dragCtx = { startX: e.clientX, startY: e.clientY, startSize: state.size }; return;
      }
      if (e.target.closest("#coreHub")) { mode = "core"; return; }

      const { r, deg } = pointerToPolar(e.clientX, e.clientY), hit = hitTestRing(r, deg);
      if (hit) {
        mode = "scrub"; companionRoot.setPointerCapture(e.pointerId);
        dragCtx = { moved: false, startX: e.clientX, startY: e.clientY, downRing: hit.ringKey, downIdx: hit.idx, pCat: state.cat, pTopic: state.topic, pQ: state.q };
      } else if (r > 204 && r <= 232) {
        mode = "move-gimbal"; companionRoot.setPointerCapture(e.pointerId); companionRoot.classList.add("dragging-window");
        const rect = companionRoot.getBoundingClientRect();
        dragCtx = { startX: e.clientX, startY: e.clientY, startCx: rect.left + rect.width / 2, startCy: rect.top + rect.height / 2 };
      }
    });

    companionRoot.addEventListener("pointermove", (e) => {
      if (activePointers.has(e.pointerId)) activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (mode === "pinch" && activePointers.size === 2 && pinchState && !pinchState.triggered) {
        const pts = [...activePointers.values()];
        const ratio = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y) / pinchState.startDist;
        if (ratio < 0.58) { pinchState.triggered = true; setCollapsed(true); }
        else { state.size = clamp(pinchState.startSize * ratio, 210, 480); applyCompanionGeometry(); saveState(); }
        return;
      }
      if (mode === "move-gimbal") {
        state.dockEdge = null;
        state.cx = dragCtx.startCx + (e.clientX - dragCtx.startX);
        state.cy = dragCtx.startCy + (e.clientY - dragCtx.startY);
        applyCompanionGeometry(); return;
      }
      if (mode === "resize") {
        state.size = clamp(dragCtx.startSize + ((e.clientX - dragCtx.startX) + (e.clientY - dragCtx.startY)) * 1.1, 210, 480);
        applyCompanionGeometry(); return;
      }
      if (mode === "scrub") {
        if (!dragCtx.moved && Math.hypot(e.clientX - dragCtx.startX, e.clientY - dragCtx.startY) > 7) {
          dragCtx.moved = true; companionRoot.classList.add("is-scrubbing");
        }
        if (!dragCtx.moved) return;
        const { r, deg } = pointerToPolar(e.clientX, e.clientY), hit = hitTestRing(r, deg);
        if (!hit) return;
        let changed = false;
        if (hit.ringKey === "outer" && hit.idx !== dragCtx.pCat) { dragCtx.pCat = hit.idx; dragCtx.pTopic = 0; dragCtx.pQ = 0; changed = true; }
        else if (hit.ringKey === "middle" && hit.idx !== dragCtx.pTopic) { dragCtx.pTopic = hit.idx; dragCtx.pQ = 0; changed = true; }
        else if (hit.ringKey === "inner" && hit.idx !== dragCtx.pQ) { dragCtx.pQ = hit.idx; changed = true; }
        if (changed) updateUI({ cat: dragCtx.pCat, topic: dragCtx.pTopic, q: dragCtx.pQ });
      }
    });

    function endCompanionPointer(e) {
      activePointers.delete(e.pointerId);
      if (activePointers.size < 2 && mode === "pinch") { mode = null; pinchState = null; return; }
      companionRoot.classList.remove("is-scrubbing", "dragging-window");
      if (mode === "move-gimbal" || mode === "resize") {
        const rect = companionRoot.getBoundingClientRect();
        state.cx = rect.left + rect.width / 2; state.cy = rect.top + rect.height / 2; saveState();
      } else if (mode === "core") {
        commitSelection(Math.floor(Math.random() * 5), Math.floor(Math.random() * 3), Math.floor(Math.random() * 5));
      } else if (mode === "scrub") {
        if (dragCtx.moved) commitSelection(dragCtx.pCat, dragCtx.pTopic, dragCtx.pQ);
        else if (dragCtx.downRing === "outer") commitSelection(dragCtx.downIdx, 0, 0);
        else if (dragCtx.downRing === "middle") commitSelection(state.cat, dragCtx.downIdx, 0);
        else if (dragCtx.downRing === "inner") commitSelection(state.cat, state.topic, dragCtx.downIdx);
      }
      mode = null;
    }
    companionRoot.addEventListener("pointerup", endCompanionPointer);
    companionRoot.addEventListener("pointercancel", endCompanionPointer);

    // Aether Orb Events
    aetherOrb.addEventListener("pointerdown", (e) => {
      if (e.button === 2) return;
      clearStageTimers(); autoSequenceLock = false; lastInteractionTime = Date.now();
      activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (startPinchIfTwoPointers()) return;
      mode = "move-orb"; aetherOrb.setPointerCapture(e.pointerId);
      const rect = aetherOrb.getBoundingClientRect();
      dragCtx = {
        moved: false, startX: e.clientX, startY: e.clientY,
        startCx: rect.left + rect.width / 2, startCy: rect.top + rect.height / 2,
        lastX: e.clientX, lastY: e.clientY, lastT: performance.now(), vx: 0, vy: 0
      };
    });

    aetherOrb.addEventListener("pointermove", (e) => {
      if (activePointers.has(e.pointerId)) activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (mode === "pinch" && activePointers.size === 2 && pinchState && !pinchState.triggered) {
        const pts = [...activePointers.values()];
        if (Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y) / pinchState.startDist > 1.45) {
          pinchState.triggered = true; setCollapsed(false);
        }
        return;
      }
      if (mode === "move-orb") {
        if (!dragCtx.moved && Math.hypot(e.clientX - dragCtx.startX, e.clientY - dragCtx.startY) > 6) {
          dragCtx.moved = true; state.dockEdge = null; setAetherStage("awake");
          aetherOrb.classList.add("dragging-window");
          aetherOrb.classList.remove("docked", "dock-left", "dock-right", "dock-top", "dock-bottom");
        }
        if (dragCtx.moved) {
          const now = performance.now(), dt = Math.max(now - dragCtx.lastT, 8);
          dragCtx.vx = (e.clientX - dragCtx.lastX) / dt; dragCtx.vy = (e.clientY - dragCtx.lastY) / dt;
          dragCtx.lastX = e.clientX; dragCtx.lastY = e.clientY; dragCtx.lastT = now;
          state.cx = clamp(dragCtx.startCx + (e.clientX - dragCtx.startX), ORB_HALF, window.innerWidth - ORB_HALF);
          state.cy = clamp(dragCtx.startCy + (e.clientY - dragCtx.startY), ORB_HALF, window.innerHeight - ORB_HALF);
          aetherOrb.style.left = `${state.cx - ORB_HALF}px`; aetherOrb.style.top = `${state.cy - ORB_HALF}px`;
          highlightRail(detectMagneticEdge(state.cx, state.cy, dragCtx.vx, dragCtx.vy));
        }
      }
    });

    function endOrbPointer(e) {
      activePointers.delete(e.pointerId);
      aetherOrb.classList.remove("dragging-window"); highlightRail(null);
      if (mode === "pinch") { if (activePointers.size < 2) { mode = null; pinchState = null; } return; }
      if (mode === "move-orb") {
        if (!dragCtx.moved) setCollapsed(false);
        else {
          const edge = detectMagneticEdge(state.cx, state.cy, dragCtx.vx, dragCtx.vy);
          state.dockEdge = edge;
          if (edge === "left") state.cx = PEEK_VISIBLE;
          if (edge === "right") state.cx = window.innerWidth - PEEK_VISIBLE;
          if (edge === "top") state.cy = PEEK_VISIBLE;
          if (edge === "bottom") state.cy = window.innerHeight - PEEK_VISIBLE;
          applyCompanionGeometry(); setAetherStage(edge ? "sleep" : "awake"); saveState();
        }
      }
      mode = null;
    }
    aetherOrb.addEventListener("pointerup", endOrbPointer);
    aetherOrb.addEventListener("pointercancel", endOrbPointer);

    aetherOrb.addEventListener("pointerenter", () => {
      if (autoSequenceLock) return;
      lastInteractionTime = Date.now();
      if (aetherOrb.getAttribute("data-stage") === "sleep") setAetherStage("awake");
    });

    aetherOrb.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); setCollapsed(false); }
    });

    companionRoot.addEventListener("contextmenu", (e) => { e.preventDefault(); setCollapsed(true); });
    aetherOrb.addEventListener("contextmenu", (e) => { e.preventDefault(); setCollapsed(false); });
    document.getElementById("collapseBtn").addEventListener("click", () => setCollapsed(true));
    document.getElementById("toggleFormBtn").addEventListener("click", () => setCollapsed(!state.collapsed));

    function handleTrackpadPinch(e) {
      if (!e.ctrlKey) return;
      e.preventDefault();
      if (!state.collapsed) {
        state.size -= e.deltaY * 2.2;
        if (state.size < 185) { state.size = 290; setCollapsed(true); }
        else { state.size = clamp(state.size, 210, 480); applyCompanionGeometry(); saveState(); }
      } else if (e.deltaY < -6) setCollapsed(false);
    }
    companionRoot.addEventListener("wheel", handleTrackpadPinch, { passive: false });
    aetherOrb.addEventListener("wheel", handleTrackpadPinch, { passive: false });

    // Gaze Tracking: Mouse Hover + Last Touch Anywhere on Page!
    window.addEventListener("pointerdown", (e) => {
      if (!e.target.closest("#aetherOrb") && state.collapsed) {
        lastInteractionTime = Date.now();
        aimGazeAt(e.clientX, e.clientY);
      }
    });

    window.addEventListener("pointermove", (e) => {
      if (e.pointerType === "mouse") {
        if (!state.collapsed && !mode) {
          const rect = companionRoot.getBoundingClientRect();
          if (e.clientX >= rect.left && e.clientX <= rect.right && e.clientY >= rect.top && e.clientY <= rect.bottom) {
            const nx = (e.clientX - rect.left) / rect.width - 0.5, ny = (e.clientY - rect.top) / rect.height - 0.5;
            gimbalTilt.style.transform = `rotateX(${(-ny * 10).toFixed(2)}deg) rotateY(${(nx * 10).toFixed(2)}deg)`;
          } else gimbalTilt.style.transform = "rotateX(0deg) rotateY(0deg)";
        }
        if (state.collapsed && aetherOrb.getAttribute("data-stage") === "awake") {
          aimGazeAt(e.clientX, e.clientY);
        }
      }
    });

    document.getElementById("resetPrefsBtn").addEventListener("click", () => {
      try { localStorage.removeItem(STORAGE_KEY); } catch (_) {}
      clearStageTimers(); autoSequenceLock = false; state = defaultState();
      setCollapsed(true); setAetherStage("awake"); commitSelection(0, 0, 0); applyCompanionGeometry();
    });

    window.addEventListener("resize", applyCompanionGeometry);

    if (state.collapsed) {
      companionRoot.classList.add("is-hidden"); aetherOrb.classList.remove("is-hidden");
      setAetherStage(state.dockEdge ? "sleep" : "awake");
    } else {
      aetherOrb.classList.add("is-hidden"); companionRoot.classList.remove("is-hidden");
    }
    applyCompanionGeometry();
    updateUI();
  </script>
</body>
</html>
