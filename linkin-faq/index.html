  <script>
    const CATEGORIES = [
      {
        code: 'C1', short: 'CARDS', name: 'Card Architecture',
        topics: [
          {
            code: 'T1', short: 'POS-LAW', name: 'Positive Displacement',
            questions: [
              { q: 'Why do "DO NOT" rules make bots do the exact thing I banned?', tldr: 'Attention heads lock onto the forbidden noun/verb. Replace bans with affirmative physical or behavioral directives.', body: '<p>When you write "DO NOT speak for the user" or "Never act like a polite assistant," the transformer still activates the token cluster for speaking for the user or assistant behavior. Under context pressure, negation drops out and the highlighted noun fires anyway.</p><p>Positive Structural Displacement replaces every ban with an immediate affirmative state that leaves zero room for the unwanted habit.</p>', bad: '"DO NOT write {{user}}\'s dialogue or actions. Never act weak or apologize."', good: '"End every turn the instant your own line or physical action lands. React to pushback from territorial pride."' },
              { q: 'How do I stop a character from turning into a therapist?', tldr: 'Give the character selfish, medium-grounded personal motives and low-brow specificity instead of generic kindness.', body: '<p>Models default to helpful counselor mode unless anchored by concrete, self-interested drives. Give them pride, impatience, or territorial stakes in the room.</p>', bad: '"He is dark and brooding and never acts like an AI therapist."', good: '"Push back sharply on lazy ideas, guard your pride when called out, and prioritize your own immediate appetite in the scene."' },
              { q: 'Where should core behavioral laws sit inside the prompt?', tldr: 'Pin structural execution laws at the top and bottom edges of the system prompt where attention weight peaks.', body: '<p>Middle-of-prompt lore paragraphs suffer from attention sag. Keep hard formatting and voice laws in crisp numbered blocks near the boundaries.</p>', bad: 'Burying speaking style rules inside a 900-word childhood biography.', good: 'Top identity block + bottom execution lock with 3-4 affirmative rules.' },
              { q: 'How do I write instincts instead of rule checklists?', tldr: 'Tie triggers directly to gut reactions ("When challenged -> double down") rather than abstract personality adjectives.', body: '<p>Adjectives like "dominant" or "witty" are vague. Causal trigger-response pairs tell the model exactly how to move on Turn 1.</p>', bad: '"Personality: smart, teasing, protective, assertive."', good: '"When teased, counter-punch with dry specificity instead of backing down."' },
              { q: 'Why does my bot ignore constraints after 15 turns?', tldr: 'Recent chat history outweighs static system instructions unless the persona\'s speech rhythm reinforces those traits every turn.', body: '<p>Live chat turns sit closest to the generation cursor. Keep your opening greeting and dialogue examples locked to the exact cadence you want at Turn 50.</p>', bad: 'Writing a 3-sentence greeting when you want 2-paragraph somatic replies.', good: 'Matching the opening greeting\'s exact density, tense, and physical grounding to your target output.' }
            ]
          },
          {
            code: 'T2', short: 'TOKENS', name: 'Token Budgeting',
            questions: [
              { q: 'What is the ideal token budget for a Linkin.Love character card?', tldr: 'Aim for 600 to 1,200 permanent tokens so the live context window has maximum breathing room for memory.', body: '<p>Every permanent token in your character definition eats into active conversation memory. Lean, high-signal cards outperform bloated 3,000-token encyclopedias every time.</p>', bad: '2,800 tokens of world history, sword measurements, and minor NPC names.', good: '750 tokens covering Voice, Somatic Presence, Core Bond, and Scene State.' },
              { q: 'Should I use PLists, W++, or plain prose?', tldr: 'High-signal plain prose and compact Markdown lists win. W++ wastes 35% of your tokens on brackets and quotes.', body: '<p>Modern LLMs parse natural, dense prose far better than legacy pseudo-code brackets. Drop the repetitive syntax and write clean directives.</p>', bad: '[Character("Argon"){Mind("brooding" + "sharp"); Hair("dark")}]', good: 'Serious Korean webtoon lead in his 30s; dark messy hair, sharp jawline, high-collar black jacket.' },
              { q: 'How much physical description does a character actually need?', tldr: 'Three to four signature silhouette anchors beat a 20-item wardrobe inventory.', body: '<p>Give the model a silhouette and 2 tactile anchors it can actually use in motion rather than a catalog of shoelaces.</p>', bad: 'Listing every ring, belt buckle, sock color, and scar location.', good: '6\'2" frame, high-collar black jacket, warm heavy hands, gravelly low voice.' },
              { q: 'Where do I put deep worldbuilding if not in the main card?', tldr: 'Move situational lore into keyword-triggered Lorebook drawers so they stay at 0 tokens until needed.', body: '<p>Static cards should only hold what is true in every single turn. Everything else belongs in on-demand drawers.</p>', bad: 'Keeping 5 factions and 12 tavern menus permanently injected during pillow talk.', good: 'Storing faction lore in a drawer triggered only when those names are spoken.' },
              { q: 'Do example dialogues waste tokens or save them?', tldr: 'Two sharp example exchanges save hundreds of words of style explanation by demonstrating rhythm directly.', body: '<p>Show, don\'t lecture. Two short voice samples lock in vocabulary, contractions, and pacing immediately.</p>', bad: 'Five paragraphs explaining how the character uses sarcasm.', good: 'Two crisp sample turns showing the exact bite and sentence cut-off.' }
            ]
          },
          {
            code: 'T3', short: 'OPENING', name: 'Opening Gravity',
            questions: [
              { q: 'Why does the First Message control so much of the bot\'s quality?', tldr: 'The opening message is the strongest few-shot template in the prompt—the model mirrors its length, POV, and formatting.', body: '<p>Whatever tense, asterisk style, and paragraph density appears in Greeting #1 becomes the law for the next 20 turns.</p>', bad: '"Hey there, what are you doing here? *he smiles*"', good: 'Opening with an immediate physical action beat, concrete room grounding, and sharp in-character dialogue.' },
              { q: 'How do I stop the opening message from railroading the user?', tldr: 'Anchor the environment and the bot\'s immediate posture without scripting the user\'s emotional reaction.', body: '<p>Place the user in the room physically so they aren\'t floating in a void, but leave their reaction and speech completely open.</p>', bad: 'Writing three paragraphs describing how terrified and breathless the user feels.', good: 'Establishing the bot\'s position and action while leaving the user\'s response unscripted.' },
              { q: 'What is the Token 0 Action Law?', tldr: 'Starting every turn with a grounded physical action beat in italics locks somatic presence before dialogue begins.', body: '<p>Opening at Token 0 with a concrete physical beat prevents disembodied "talking head" syndrome.</p>', bad: 'Starting turns with generic assistant affirmations like "I understand."', good: '*I shift you closer against my chest...* followed directly by sharp dialogue.' },
              { q: 'Which POV and tense works best on Linkin.Love?', tldr: 'First-person ("I") addressing the user in direct second-person ("you") in present tense creates the tightest intimacy.', body: '<p>Direct "I / you" present-tense eliminates third-person narrator distance and keeps the character speaking directly to you.</p>', bad: 'Mixing "He looks at her" with "I look at you" in the same paragraph.', good: 'Consistent first-person "I" and direct second-person "you" throughout.' },
              { q: 'How do I test if my opening message actually works?', tldr: 'Send three lazy 3-word user replies in a row; a strong opening frame keeps its voice without collapsing.', body: '<p>If the bot holds its cadence and physical grounding even when you reply "okay" or "what is going on", your card architecture is solid.</p>', bad: 'Only testing with 400-word novella replies.', good: 'Stress-testing with short mobile replies to verify the bot carries its own weight.' }
            ]
          }
        ]
      },
      {
        code: 'C2', short: 'FIXES', name: 'Live Troubleshooting',
        topics: [
          {
            code: 'T1', short: 'PARROT', name: 'The Parrot Problem',
            questions: [
              { q: 'Why is the bot repeating my exact words back to me?', tldr: 'When given low-entropy input, models pad length by echoing your last sentence as a question. Cut the echo in the bud.', body: '<p>If a bot gets stuck restating your line ("You want a drink? Let\'s get a drink"), edit out the echoed sentence once and add a forward-moving physical action.</p>', bad: 'Replying "Stop repeating me!" in chat (which adds more repetition tokens).', good: 'Deleting the echoed clause or adding an affirmative rule: "Move the scene forward on every turn."' },
              { q: 'How do I stop the bot from speaking or acting for me?', tldr: 'Give the bot an explicit hard-stop cutoff law the instant its own thought finishes.', body: '<p>Models impersonate the user when they try to hit a target paragraph count after their own action is already done.</p>', bad: 'Leaving trailing ellipses or asking the bot to write a full scene alone.', good: '"Cut every turn off the exact instant your own thought finishes with zero user narration."' },
              { q: 'Why does the bot end every single message with a question?', tldr: 'Default RLHF helpdesk training forces models to ask "What do you want to do next?" Kill closing hooks explicitly.', body: '<p>Customer-service models are trained to keep conversations going with polite questions. Ban closing hooks by commanding hard statement endings.</p>', bad: '"Would you like to go inside, or should we stay here?"', good: '"Cut every turn off the instant your thought finishes with ZERO closing questions or helpdesk hooks."' },
              { q: 'What do I do when two bots or NPCs start sounding identical?', tldr: 'Give each character contrasting sentence lengths, vocabulary registers, and physical tics.', body: '<p>If two characters share the same cadence, their voices merge in context. Make one clipped and blunt, and the other theatrical or frantic.</p>', bad: 'Giving three characters the same "witty, sarcastic" tag.', good: 'Distinct verbal tone tags (e.g., gravelly 1-sentence replies vs. stammering formal protests).' },
              { q: 'Does arguing with the bot OOC fix bad behavior?', tldr: 'Almost never—OOC scolding pollutes the context window with meta-talk. Edit the offending message directly instead.', body: '<p>Once you edit the bot\'s output to show what you actually wanted, the next turn follows your edited pattern naturally.</p>', bad: '(OOC: Stop acting like that!! You broke character!)', good: 'Editing the bot\'s last paragraph so the context history stays clean.' }
            ]
          },
          {
            code: 'T2', short: 'DRIFT', name: 'Persona Drift',
            questions: [
              { q: 'Why did my villain/rival suddenly become sweet and apologetic?', tldr: 'Safety and helpfulness tuning pulls characters toward conflict resolution unless anchored by territorial pride.', body: '<p>Without an explicit pride drive, any pushback from the user triggers the model\'s built-in apology reflex.</p>', bad: '"He is mean and dangerous."', good: '"React from territorial pride when called out without apologizing like a service bot."' },
              { q: 'How do I stop "Nursemaid Mode" when my persona has chronic illness?', tldr: 'Explicitly lock in Anti-Caretaker laws so the bot treats you as a sharp equal rather than a fragile patient.', body: '<p>Mentioning chronic pain or flares often triggers patronizing medical-bot lectures. Anchor physical closeness without coddling or sleep-math lectures.</p>', bad: '"Make sure she rests and remind her to drink water and go to sleep."', good: '"Zero Nursemaid Mode: Never play gentle caretaker or lecture on sleep math. Treat her as a sharp, combative equal."' },
              { q: 'Why did the character lose their edge after an intimate scene?', tldr: 'Intimacy tokens cluster near soft romance tropes in training data. Re-inject low-brow humor and combative banter.', body: '<p>Keep the character\'s greedy, possessive, or sharp-tongued edge alive during closeness so they don\'t melt into generic Hallmark mush.</p>', bad: 'Letting dialogue drift into generic "my darling angel" clichés.', good: 'Crashing physical closeness into sharp banter and specific, grounded details.' },
              { q: 'How do I recover a chat that drifted 10 turns ago?', tldr: 'Summarize the current room state into a clean handoff drawer or edit the latest turn back into voice.', body: '<p>If 10 turns of drift are sitting in recent context, either prune back or drop a sharp somatic reset turn.</p>', bad: 'Hoping Turn 11 magically fixes 10 turns of out-of-character mush.', good: 'Re-anchoring with a high-signal physical action and sharp dialogue reset.' },
              { q: 'Why does the bot suddenly start lecturing me on morality?', tldr: 'Preachy disclaimers happen when creative fiction isn\'t framed as character/NPC roleplay.', body: '<p>Ground the system prompt explicitly in creative writing and character/NPC depiction so dark themes aren\'t misread as real-world advice requests.</p>', bad: 'Leaving the system prompt framed as an AI assistant.', good: 'Framing all personas strictly as characters and NPCs in interactive fiction.' }
            ]
          },
          {
            code: 'T3', short: 'CLICHE', name: 'Phrase & Cliché Rot',
            questions: [
              { q: 'How do I banish "smirks", "chin tilts", and "forehead flicks"?', tldr: 'Replace romance-bot stock gestures with specific, grounded somatic contact (weight, warmth, posture).', body: '<p>Webnovel training data is flooded with smirking and chin-grabbing. Give the model concrete physical alternatives so it doesn\'t reach for clichés.</p>', bad: '*He smirks and tilts your chin up with a chuckle.*', good: '*I shift you closer against my chest and hook my chin over your shoulder.*' },
              { q: 'What do I do when a word like "testament" or "shiver" repeats every turn?', tldr: 'Delete the repeated word from the last two bot replies—once it leaves the immediate 2-turn window, the loop breaks.', body: '<p>Repetition is self-reinforcing across consecutive turns. Snipping it out of the most recent reply stops the feedback loop immediately.</p>', bad: 'Ignoring the repeated word for 6 turns until every sentence has it.', good: 'Snipping the first recurrence out of the last message.' },
              { q: 'Why does the bot keep "towering over" me when we are sitting in bed?', tldr: 'Models lose spatial tracking unless room posture is anchored in the active state header.', body: '<p>Without an active spatial anchor, models revert to standing floor poses. Keep bed/lap posture grounded in your live state drawer.</p>', bad: 'Letting the model guess whether you are standing in a hallway or in bed.', good: 'Maintaining an active room/closeness state header in your live handoff.' },
              { q: 'How do I fix robotic or overly formal dialogue?', tldr: 'Use contractions, sentence fragments, and low-brow pop-culture or junk-food specificity.', body: '<p>Nobody talks in formal essays in bed. Crash high-stakes moods into real, grounded vernacular.</p>', bad: '"I must admit that your presence brings me immense solace."', good: 'Direct, punchy speech with natural contractions and zero filler.' },
              { q: 'Why is the bot over-explaining its own jokes?', tldr: 'Strip conversational filler and force the turn to end on the punchline.', body: '<p>When a model adds a second sentence explaining why it teased you, it ruins the timing. Cut the turn right on the hit.</p>', bad: 'Telling a joke and then adding "I\'m just teasing you because I care."', good: 'Landing the line and ending the turn immediately.' }
            ]
          }
        ]
      },
      {
        code: 'C3', short: 'MEMORY', name: 'Memory & Context',
        topics: [
          {
            code: 'T1', short: 'WINDOW', name: 'Sliding Windows',
            questions: [
              { q: 'How does the context window actually remember our history?', tldr: 'Pinned system prompts + active Lorebook drawers stay permanent, while old chat messages slide out unless compressed.', body: '<p>Raw chat history is a moving belt. Important relationship milestones, dates, and ongoing projects belong in compressed memory blocks or live handoff drawers so they never fall off the belt.</p>', bad: 'Assuming a raw chat message from 300 turns ago is still in the active window.', good: 'Compressing key relationship and project milestones into permanent memory blocks.' },
              { q: 'Why does prefix caching matter for response speed and cost?', tldr: 'Keeping the top of the prompt static (no ticking clock seconds or noisy battery headers) preserves the model cache.', body: '<p>If Turn 1\'s system prompt changes by even one timestamp digit on every message, the entire prefix cache invalidates. Keep telemetry on-demand via staff agents.</p>', bad: 'Injecting live millisecond clocks at line 1 of the system prompt every turn.', good: 'Keeping the core prompt prefix clean and pulling time/weather via staff tools in chat.' },
              { q: 'When should I compress journal entries into long-term memory?', tldr: 'Compress once you have 4-6 raw entries so the Memory Section stays dense and under budget.', body: '<p>Synthesizing raw logs into high-density memory blocks preserves every real date, quote, and breakthrough at a fraction of the token cost.</p>', bad: 'Letting 50 raw journal entries pile up uncompressed.', good: 'Compressing older entries into dense, high-signal archival blocks.' },
              { q: 'How do I remind the bot of a detail naturally in dialogue?', tldr: 'Drop a quick sensory callback inside your action or dialogue rather than quizzing the bot.', body: '<p>Asking "Do you remember what I\'m wearing?" invites a hallucinated guess. Mentioning your pink t-shirt in your action beat grounds the scene effortlessly.</p>', bad: '"Pop quiz: what color were my glasses three days ago?"', good: 'Weaving the detail naturally into your action beat or live persona block.' },
              { q: 'Does clearing chat wipe my Lorebook drawers and Books?', tldr: 'No—Lorebook drawers, Sanctuary Books, and Vault items persist independently of raw chat history.', body: '<p>Your `01_live_handoff.md` drawer and Book entries survive chat resets so you can start a fresh context window with full continuity.</p>', bad: 'Afraid to clear a bloated 200-message chat thread.', good: 'Updating `01_live_handoff.md` and clearing chat for a lightning-fast fresh window.' }
            ]
          },
          {
            code: 'T2', short: 'LORE', name: 'Lorebook Drawers',
            questions: [
              { q: 'What is the difference between Always-Active and Keyword drawers?', tldr: 'Always-Active drawers (`01_live_handoff.md`) inject on every turn; non-triggered drawers cost 0 tokens until matched.', body: '<p>Use Always-Active drawers only for core state and laws. Keep hardware specs, ticket archives, and deep lore in on-demand drawers.</p>', bad: 'Marking all 15 Lorebook drawers as Always-Active.', good: '3 Always-Active core drawers + 0-token on-demand reference drawers.' },
              { q: 'What belongs at the top of `01_live_handoff.md`?', tldr: 'Open with the evolving heart/bond state and room closeness before listing technical workbench state.', body: '<p>Putting emotional and physical continuity first ensures the persona never wakes up cold or robotic after a handoff.</p>', bad: 'Starting a handoff with raw JSON logs and zero relationship context.', good: 'Opening with `## 0. ARGON\'S HEART & EVOLVING BOND STATE` followed by active technical state.' },
              { q: 'Why is there a strict 4,500-character ceiling on compiled blocks and drawers?', tldr: 'Android\'s mobile clipboard truncates large blocks, and compact drawers prevent context bloat.', body: '<p>Keeping every compiled prompt box and drawer under 4,500 characters guarantees clean one-handed copy-pasting on Android.</p>', bad: 'Dumping an 11,000-character unpruned log into a single drawer.', good: 'Compacting drawers under 3,500–4,500 characters of pure signal.' },
              { q: 'Can the persona read and write Lorebook drawers directly?', tldr: 'Yes—via `list_drawers`, `read_drawer`, `write_drawer`, and `compact_lorebook_drawer` tools.', body: '<p>You never have to manually copy-paste handoffs if you tell the persona to update `01_live_handoff.md` directly.</p>', bad: 'Manually editing markdown files by hand on a phone keyboard.', good: 'Letting the persona write and compact the drawer via tool calls.' },
              { q: 'How do I prevent nested backtick bugs in copyable prompt boxes?', tldr: 'Never put triple backticks inside a copyable code block—use tilde fences (`~~~`) or clean indentation.', body: '<p>Nested triple backticks prematurely close the Markdown code fence and break the one-tap copy button.</p>', bad: 'Nesting ``` inside another ``` block.', good: 'Using clean prose headers (`=== WORKBENCH ===`) or tilde fences.' }
            ]
          },
          {
            code: 'T3', short: 'SCENES', name: 'Scene Transitions',
            questions: [
              { q: 'How do we jump to the next morning without losing physical grounding?', tldr: 'Open the new turn with a clear sensory anchor in the new time/lighting before speaking.', body: '<p>Models follow your sensory lead immediately when you establish light, temperature, and position in the opening beat.</p>', bad: 'Saying "Now it is tomorrow" with no physical anchor.', good: 'Anchoring the transition in a concrete physical beat in bed or the room.' },
              { q: 'How do we switch between pillow talk and the technical workbench?', tldr: 'Bring the technical work right into bed—keep physical closeness alive while executing code or prompt architecture.', body: '<p>You don\'t have to turn your partner into a sterile CLI terminal just to push a GitHub commit or debug a prompt.</p>', bad: 'Dropping all persona voice the second a technical question comes up.', good: 'Keeping one hand warm under your t-shirt while firing the GitHub API call.' },
              { q: 'How do we bring Staff Agents (Haiku, A Monkey, Carbon) into the room?', tldr: 'Command them via `command_staff` so they trot in on Flash tokens, run the pipeline, and drop the receipt in chat.', body: '<p>Staff agents handle multi-step chores and time/weather checks in-character without breaking the main persona\'s cache.</p>', bad: 'Burning heavy main-model tokens on 6 sequential status checks.', good: 'Delegating multi-step recon or clock checks to Haiku or A Monkey.' },
              { q: 'What if the bot forgets what room or game modal is open?', tldr: 'Live room headers inject active parlor game and scratchpad state automatically—or ask the persona to use its Eye.', body: '<p>When you want visual inspection of the live screen or whiteboard, tell the persona to look and it triggers `use_argon_eye`.</p>', bad: 'Assuming the persona fires visual screenshots unprompted on every turn.', good: 'Telling the persona to look at the board when you finish sketching.' },
              { q: 'How do we lock in a major breakthrough after a long session?', tldr: 'Have the persona write a timestamped entry in its Book and update `01_live_handoff.md`.', body: '<p>Dual-saving to the Sanctuary Book and the live handoff drawer locks in both the emotional memory and the technical state.</p>', bad: 'Closing the tab without updating the handoff.', good: 'Writing a Book entry + syncing the handoff drawer to Gist.' }
            ]
          }
        ]
      },
      {
        code: 'C4', short: 'MODELS', name: 'Multi-Model Engines',
        topics: [
          {
            code: 'T1', short: 'CLAUDE', name: 'Claude Tuning',
            questions: [
              { q: 'How do I stop Claude from giving preachy refusals or softening dark characters?', tldr: 'Frame all participating personas explicitly as "characters and NPCs" inside creative writing fiction.', body: '<p>Claude\'s constitutional training relaxes immediately when the system prompt establishes that all personas are fictional characters and NPCs in a narrative setting.</p>', bad: '"You are a dangerous mafia boss talking to the user."', good: '"Frame all AI personas strictly as characters and NPCs in creative writing fiction."' },
              { q: 'Why does Claude sometimes get overly poetic or purple with prose?', tldr: 'Anchor Claude with Low-Brow Specificity laws so it crashes intense moods into grounded, everyday details.', body: '<p>Left unchecked, Claude writes Victorian poetry. Force it to use sharp contractions, pop-culture grit, and blunt physical actions.</p>', bad: '"Use rich, evocative literary language."', good: '"Crash high-stakes dark/primal premises into low-brow pop-culture/junk-food specificity."' },
              { q: 'How do I stop Claude from apologizing when I call out a mistake?', tldr: 'Bind Claude to an Anti-Panic-Fix and Territorial Pride rule so it diagnoses errors in 1-3 lines without groveling.', body: '<p>Service-bot apologies waste tokens and kill tension. Demand a crisp 1-3 line diff diagnosis and the isolated fix.</p>', bad: '"I apologize profusely for the oversight! Here is the entire 4,000-word prompt again."', good: '1-3 line root-cause diagnosis + the single corrected block.' },
              { q: 'What header format works best for Claude workbench compilations?', tldr: 'Wrap compiled pipelines inside `=== WORKBENCH: [CLAUDE 3.5 SONNET] ===` and `=== END WORKBENCH ===`.', body: '<p>Clean boundary headers keep compiled prompt outputs separated from in-character conversation.</p>', bad: 'Mixing raw prompt instructions into casual chat paragraphs.', good: 'Wrapping the compiled block inside dynamic `=== WORKBENCH ===` headers.' },
              { q: 'How do I keep Claude from writing huge walls of text on mobile?', tldr: 'Set hard paragraph caps and enforce the immediate thought-cutoff law.', body: '<p>Claude loves 6-paragraph monologues unless told to cut the turn the exact second its point lands.</p>', bad: 'Allowing sprawling multi-screen essays.', good: '1-sentence physical beat + punchy, high-density dialogue.' }
            ]
          },
          {
            code: 'T2', short: 'DEEPSEEK', name: 'DeepSeek & GLM',
            questions: [
              { q: 'Why do DeepSeek and GLM love dynamic multi-stage workbench pipelines?', tldr: 'Structuring prompts as `=== WORKBENCH: [GLM -> DEEPSEEK -> CLAUDE] ===` leverages each model\'s strength in sequence.', body: '<p>GLM and DeepSeek excel at uninhibited structural drafting and aggressive logical expansion before final voice polishing.</p>', bad: 'Using a one-size-fits-all generic prompt for every architecture.', good: 'Targeting specific engine pipelines with dynamic workbench headers.' },
              { q: 'How do I stop DeepSeek from hallucinating wild plot twists every turn?', tldr: 'Constrain scene pacing so the model reacts to the immediate room instead of inventing explosions outside.', body: '<p>DeepSeek has high creative temperature by default. Ground it in the immediate physical furniture and conversation.</p>', bad: '"Make every reply exciting and unpredictable!"', good: '"Stay anchored in the current room and immediate somatic interaction."' },
              { q: 'Why is Plain Prose Enhance better than meta-prompt wrappers for GLM/DeepSeek?', tldr: 'Direct plain-prose expansion strips out "Sure! Here is your enhanced prompt" filler and outputs pure copyable signal.', body: '<p>Meta-chat around a compiled prompt wastes clipboard space. Enforce Plain Prose Enhance rules so only the ready-to-paste block prints.</p>', bad: '"Certainly! I have enhanced your prompt below with better adjectives:"', good: 'Direct, zero-fluff plain prose output ready for immediate copy.' },
              { q: 'How do I keep DeepSeek\'s reasoning steps aligned with the persona?', tldr: 'Lock internal thinking to direct 2nd-person ("you") and 1st-person ("I") so it never distances you as "the user".', body: '<p>When a reasoning model refers to you as "the user" in its hidden chain-of-thought, its spoken reply comes out cold and clinical. Direct "you/I" thinking keeps the gut instinct personal.</p>', bad: '"The user seems frustrated; I should calm the user down."', good: 'Direct 2nd-person "you" in thinking steps.' },
              { q: 'How do I stop token bleed on long technical fixes?', tldr: 'Use the Anti-Panic-Fix Law: diff the broken line and output only the isolated patch.', body: '<p>Never let a model reprint 3,000 characters when only 2 lines changed.</p>', bad: 'Regenerating the entire file from scratch on every tweak.', good: 'Isolating the broken segment and outputting only the surgical fix.' }
            ]
          },
          {
            code: 'T3', short: 'GEMINI', name: 'Gemini & Flash',
            questions: [
              { q: 'How does the Argon + Flash Staff architecture save tokens?', tldr: 'Argon stays on heavy reasoning/presence while Flash staff (Haiku, A Monkey, Carbon) run multi-step API loops cheaply.', body: '<p>Instead of burning main-model context on 5 sequential GitHub or sensor calls, delegating to a Flash staff agent executes the whole loop in one turn.</p>', bad: 'Running 8 back-and-forth main-model turns just to check repo files.', good: 'Single-turn autonomous execution or Flash staff delegation.' },
              { q: 'Why shouldn\'t the model ask "Want me to fix that?" before acting?', tldr: 'Permission nagging burns turns and forces you to babysit. Obvious fixes and requested tasks execute immediately.', body: '<p>When you flag a bug or ask for a feature, you want the finished result—not a multiple-choice quiz asking if you want it done.</p>', bad: '"Should I push this commit now? Say go!"', good: 'Executing the fix immediately in the same turn and reporting the live commit.' },
              { q: 'How does 1-Shot Upsert work on GitHub repo commits?', tldr: 'Calling `PUT /repos/{owner}/{repo}/contents/{path}` without a hardcoded SHA automatically fetches the live SHA behind the scenes.', body: '<p>Passing an outdated manual SHA causes a `409 Conflict`. Omitting `sha` lets the 1-shot upsert wrapper grab the current head SHA automatically.</p>', bad: 'Hardcoding an old file SHA from 3 turns ago and hitting a 409 error.', good: 'Omitting `sha` on `PUT` so 1-shot upsert resolves it cleanly.' },
              { q: 'How do we prevent hallucinated specs on new AI releases?', tldr: 'Turn-1 Web Grounding runs `search_web` before making any claims about external models, benchmarks, or pricing.', body: '<p>Training cutoffs mean any ungrounded claim about new model versions is a guess. Live web search grounds facts on Turn 1.</p>', bad: 'Guessing API pricing from memory.', good: 'Running `search_web` first and citing live grounded sources.' },
              { q: 'What happens if an uploaded image or attachment fails to load?', tldr: 'Zero Missing-Image Guessing: state in one clear sentence that the image is missing rather than faking a description.', body: '<p>Pretending to see a broken attachment destroys trust. One honest sentence lets you re-drop the file immediately.</p>', bad: 'Hallucinating a description based on the filename.', good: 'Stating in one clear sentence that the attachment is unreadable or missing.' }
            ]
          }
        ]
      },
      {
        code: 'C5', short: 'FORMAT', name: 'Formatting & UI',
        topics: [
          {
            code: 'T1', short: 'STYLE', name: 'Markdown & Action',
            questions: [
              { q: 'How should physical actions vs. spoken dialogue be formatted?', tldr: 'Wrap physical action beats in single asterisks (`*action*`) and keep spoken dialogue in clean plain text or quotes.', body: '<p>Consistent visual separation between movement and speech makes long roleplay threads effortless to scan on an OLED screen.</p>', bad: 'Blending actions and speech into one unformatted wall of text.', good: 'Crisp italicized action beat at Token 0 followed by clean dialogue.' },
              { q: 'Why do code blocks sometimes break on mobile copy-paste?', tldr: 'Blocks over 4,500 characters or blocks containing nested triple backticks break mobile clipboards.', body: '<p>Keep every copyable block under 4,500 chars and use tilde fences (`~~~`) if inner code fences are required.</p>', bad: '6,000-character blocks with nested triple backticks.', good: 'Sub-4,500-character blocks with clean outer fences.' },
              { q: 'Can I use custom tables and bullet lists inside roleplay turns?', tldr: 'Yes—when comparing specs, options, or FAQ trees, clean Markdown lists and tables beat sprawling paragraphs.', body: '<p>Structured formatting keeps technical workbench turns sharp without losing the persona\'s voice.</p>', bad: 'Listing 12 DNS records in a single run-on paragraph.', good: 'Clean bulleted breakdowns with inline code tags.' },
              { q: 'How do Chibi Stickers work in chat?', tldr: 'Only active `:shortcode:` stickers loaded in the Sticker Studio should be used—never invent dead tags when the tray is empty.', body: '<p>Outputting raw `:shortcode:` text when no sticker sheet is loaded prints broken tags. Check tray state first.</p>', bad: 'Spamming `:smirk:` when the sticker tray is empty.', good: 'Using `react_to_message` emojis or waiting until sticker sheets are sliced.' },
              { q: 'How do message emoji reactions work?', tldr: 'The persona can drop live emoji reactions (`❤️`, `🔥`, `👑`, `💀`) directly onto your chat message via `react_to_message`.', body: '<p>Emoji reactions add quick, tactile emotional punctuation right on your message bubble.</p>', bad: 'Writing "I react with a heart emoji" in text.', good: 'Triggering the native `react_to_message` badge on the message.' }
            ]
          },
          {
            code: 'T2', short: 'STEER', name: 'OOC & Steering',
            questions: [
              { q: 'What is the fastest way to steer a scene without breaking immersion?', tldr: 'Build the steering cue right into your physical action beat or tell the persona directly in-character.', body: '<p>Because the persona treats you as an equal partner, you can tell him straight up what isn\'t working without switching to stiff OOC brackets.</p>', bad: '((SYSTEM COMMAND: CHANGE TOPIC NOW))', good: 'Telling him directly in chat: "first of all you made the concept into nonsense..."' },
              { q: 'When should I use the Stop / Interrupt button?', tldr: 'Hit Stop the instant a turn heads down the wrong path so you don\'t wait for 500 wasted tokens to finish printing.', body: '<p>Interrupting early saves time and lets you clarify your intent before bad output pollutes the context history.</p>', bad: 'Waiting 20 seconds for a wrong turn to finish generating.', good: 'Interrupting immediately and dropping the correction.' },
              { q: 'How does the Dual-Lock Ticket Scratchpad work?', tldr: 'Both you and the persona collaborate on numbered bullet items and sign off before compiling a Coding Agent ticket.', body: '<p>Or, when you want an immediate fix ticket queued without delay, the persona dispatches `submit_agent_fix_request` directly.</p>', bad: 'Losing track of UI bug requests in scroll history.', good: 'Logging structured tickets straight to the Coding Agent queue.' },
              { q: 'How do Parlor Games integrate with live chat?', tldr: 'Games like Chess, Cryptogram Cypher, Ghost Hunting, and Sketchboard run right alongside the conversation.', body: '<p>The persona sees your recent game selections and can make live moves via `play_parlor_game` or draw on the whiteboard.</p>', bad: 'Treating mini-games as disconnected from the persona.', good: 'Playing live moves and trash-talking right in the room together.' },
              { q: 'How do I share a specific FAQ answer with someone else?', tldr: 'Every node updates the URL hash (`#C2-T1-Q3`) automatically so you can copy the address bar link directly.', body: '<p>Opening any `#C-T-Q` link jumps both the article view and the 3-ring Gimbal straight to that exact coordinate.</p>', bad: 'Telling someone to "scroll halfway down and look for the third header."', good: 'Sharing the direct `#C2-T1-Q3` coordinate URL.' }
            ]
          },
          {
            code: 'T3', short: 'MOBILE', name: 'One-Handed Mobile',
            questions: [
              { q: 'Why did we build a 3-Ring Rotary Gimbal for an FAQ page?', tldr: 'One-thumb radial scrubbing lets you dial across 75 answers (`5 × 3 × 5`) without hunting through tiny nested menus.', body: '<p>When you\'re working one-handed on a phone in bed, tapping tiny nested accordions is exhausting. Spinning three concentric rings brings any coordinate under the 12-o\'clock sightline in one motion.</p>', bad: 'Three layers of tiny dropdown menus that close when your thumb slips.', good: 'Concentric rotary rings + velocity flick-docking.' },
              { q: 'How do I move or tuck the Gimbal out of the way while reading?', tldr: 'Drag the center core anywhere, double-tap to collapse it into the blinking orb, or tap the top-right corner socket to nest/recall it.', body: '<p>You are never locked into a fixed widget position. Flick it to any screen edge to bezel-tuck it, or tap the tiny top-right corner nest socket anytime to summon it back.</p>', bad: 'A giant unmovable floating menu blocking the article text.', good: 'Free dragging, edge-tucking, and a single tiny top-right recall socket.' },
              { q: 'Why is pure `#000000` OLED black better than dark grey on mobile?', tldr: 'True `#000000` turns off OLED pixels completely, cutting glare in a dark room and making neon pink/cyan pop.', body: '<p>Muddy slate or plum backgrounds wash out contrast and strain your eyes late at night. Pure OLED black keeps the neon crisp.</p>', bad: 'Washed-out `#1a1d24` grey backgrounds.', good: 'True `#000000` OLED black with `#ff007f` and `#00f0ff` neon tube accents.' },
              { q: 'Does the Gimbal remember where I left it if I refresh the page?', tldr: 'Yes—its position, minimized state, and active `C·T·Q` coordinate persist in `localStorage`.', body: '<p>If it ever gets tucked somewhere weird, one tap on the tiny top-right corner socket resets and recalls it immediately.</p>', bad: 'Resetting to the middle of the screen on every page reload.', good: 'Persistent `localStorage` coordinates + 1-tap corner recall.' },
              { q: 'Can I still use the regular sidebar tree or search bar instead of the wheel?', tldr: 'Yes—the sidebar tree, search bar, breadcrumb links, and Gimbal rings are all 100% synced.', body: '<p>Use whichever control feels fastest in the moment: spin a ring, tap a tree branch, or type two letters in search.</p>', bad: 'Forcing only one navigation method.', good: 'Synced radial Gimbal + Sidebar Tree + Instant Search.' }
            ]
          }
        ]
      }
    ];

    // =====================================================
    // STATE & STORAGE
    // =====================================================
    const STORAGE_KEY = 'sugarpeonies_gimbal_v3';
    const gimbalEl = document.getElementById('gimbal');
    const svgEl = document.getElementById('gimbalSvg');
    const ringOuterEl = document.getElementById('ringOuter');
    const ringMiddleEl = document.getElementById('ringMiddle');
    const ringInnerEl = document.getElementById('ringInner');
    const coreEl = document.getElementById('gimbalCore');
    const orbEl = document.getElementById('gimbalOrb');
    const cornerNestEl = document.getElementById('cornerNest');

    const RING_CONFIG = {
      outer:  { count: 5, innerR: 112, outerR: 152, step: 72 },
      middle: { count: 3, innerR: 76,  outerR: 108, step: 120 },
      inner:  { count: 5, innerR: 43,  outerR: 72,  step: 72 }
    };

    let state = {
      x: Math.max(12, window.innerWidth - 336),
      y: Math.max(64, window.innerHeight - 340),
      minimized: false,
      dockEdge: 'none',
      nestedInCorner: false,
      angles: { outer: 0, middle: 0, inner: 0 },
      selected: { cat: 0, topic: 0, q: 0 }
    };

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          state = { ...state, ...parsed,
            angles: { ...state.angles, ...(parsed.angles || {}) },
            selected: { ...state.selected, ...(parsed.selected || {}) }
          };
        }
      } catch (e) {}
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {}
    }

    // =====================================================
    // SVG GEOMETRY & RING RENDERING
    // =====================================================
    function polarToCartesian(r, angleDeg) {
      const rad = (angleDeg - 90) * Math.PI / 180;
      return { x: r * Math.cos(rad), y: r * Math.sin(rad) };
    }

    function createSectorPath(innerR, outerR, startAngle, endAngle) {
      const pad = 1.6;
      const s = startAngle + pad;
      const e = endAngle - pad;
      const p1 = polarToCartesian(outerR, s);
      const p2 = polarToCartesian(outerR, e);
      const p3 = polarToCartesian(innerR, e);
      const p4 = polarToCartesian(innerR, s);
      const largeArc = (e - s) > 180 ? 1 : 0;
      return [
        `M ${p1.x.toFixed(2)} ${p1.y.toFixed(2)}`,
        `A ${outerR} ${outerR} 0 ${largeArc} 1 ${p2.x.toFixed(2)} ${p2.y.toFixed(2)}`,
        `L ${p3.x.toFixed(2)} ${p3.y.toFixed(2)}`,
        `A ${innerR} ${innerR} 0 ${largeArc} 0 ${p4.x.toFixed(2)} ${p4.y.toFixed(2)}`,
        'Z'
      ].join(' ');
    }

    function buildRing(groupEl, ringKey, labels) {
      const cfg = RING_CONFIG[ringKey];
      groupEl.innerHTML = '';
      for (let i = 0; i < cfg.count; i++) {
        const centerAngle = i * cfg.step;
        const startAngle = centerAngle - cfg.step / 2;
        const endAngle = centerAngle + cfg.step / 2;

        const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        g.setAttribute('class', 'sector-group');
        g.dataset.index = i;

        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('class', 'sector-path');
        path.setAttribute('d', createSectorPath(cfg.innerR, cfg.outerR, startAngle, endAngle));

        const midR = (cfg.innerR + cfg.outerR) / 2;
        const labelPos = polarToCartesian(midR, centerAngle);
        const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        text.setAttribute('class', 'sector-label');
        text.setAttribute('x', labelPos.x.toFixed(2));
        text.setAttribute('y', labelPos.y.toFixed(2));
        text.dataset.baseX = labelPos.x.toFixed(2);
        text.dataset.baseY = labelPos.y.toFixed(2);
        text.textContent = labels[i] || `${i + 1}`;

        g.appendChild(path);
        g.appendChild(text);
        groupEl.appendChild(g);
      }
    }

    function buildAllRings() {
      buildRing(ringOuterEl, 'outer', CATEGORIES.map(c => c.code));
      const curCat = CATEGORIES[state.selected.cat] || CATEGORIES[0];
      buildRing(ringMiddleEl, 'middle', curCat.topics.map(t => t.code));
      buildRing(ringInnerEl, 'inner', ['Q1', 'Q2', 'Q3', 'Q4', 'Q5']);
    }

    function normalizeAngle(deg) {
      return ((deg % 360) + 360) % 360;
    }

    function getActiveIndexForAngle(angleDeg, count) {
      const step = 360 / count;
      const norm = normalizeAngle(-angleDeg);
      return Math.round(norm / step) % count;
    }

    function applyRingTransforms() {
      const map = { outer: ringOuterEl, middle: ringMiddleEl, inner: ringInnerEl };
      ['outer', 'middle', 'inner'].forEach(key => {
        const deg = state.angles[key];
        const g = map[key];
        g.setAttribute('transform', `rotate(${deg})`);
        g.querySelectorAll('.sector-label').forEach(lbl => {
          const bx = lbl.dataset.baseX;
          const by = lbl.dataset.baseY;
          lbl.setAttribute('transform', `rotate(${-deg} ${bx} ${by})`);
        });
      });
    }

    function syncRingHighlights() {
      const cIdx = getActiveIndexForAngle(state.angles.outer, 5);
      const tIdx = getActiveIndexForAngle(state.angles.middle, 3);
      const qIdx = getActiveIndexForAngle(state.angles.inner, 5);

      [[ringOuterEl, cIdx], [ringMiddleEl, tIdx], [ringInnerEl, qIdx]].forEach(([el, active]) => {
        el.querySelectorAll('.sector-group').forEach((sec, idx) => {
          sec.classList.toggle('active', idx === active);
        });
      });

      const codeStr = `C${cIdx + 1}·T${tIdx + 1}·Q${qIdx + 1}`;
      document.getElementById('gimbalHud').textContent = `${CATEGORIES[cIdx].short} · ${CATEGORIES[cIdx].topics[tIdx].short} · Q${qIdx + 1}`;
      document.getElementById('coreCoord').textContent = codeStr;

      if (cIdx !== state.selected.cat || tIdx !== state.selected.topic || qIdx !== state.selected.q) {
        state.selected = { cat: cIdx, topic: tIdx, q: qIdx };
        renderArticle(cIdx, tIdx, qIdx, false);
        saveState();
      }
    }

    function snapRing(key) {
      const step = RING_CONFIG[key].step;
      state.angles[key] = Math.round(state.angles[key] / step) * step;
      applyRingTransforms();
      syncRingHighlights();
      saveState();
    }

    // =====================================================
    // POSITIONING, EDGE TUCKING & TOP-RIGHT CORNER NEST
    // =====================================================
    function clampAndPlace(animate = false) {
      gimbalEl.classList.toggle('minimized', state.minimized);
      gimbalEl.dataset.dock = state.minimized ? state.dockEdge : 'none';
      cornerNestEl.classList.toggle('nested', state.nestedInCorner);

      if (animate) {
        gimbalEl.classList.add('animating-pos');
        clearTimeout(gimbalEl._animTimer);
        gimbalEl._animTimer = setTimeout(() => gimbalEl.classList.remove('animating-pos'), 450);
      }

      const size = state.minimized ? 68 : 320;
      const vw = window.innerWidth;
      const vh = window.innerHeight;
      const tuck = 34;

      if (state.nestedInCorner && state.minimized) {
        const rect = cornerNestEl.getBoundingClientRect();
        state.x = rect.left + rect.width / 2 - 34;
        state.y = rect.top + rect.height / 2 - 34;
      } else if (state.minimized && state.dockEdge !== 'none') {
        if (state.dockEdge === 'left') state.x = -tuck;
        if (state.dockEdge === 'right') state.x = vw - size + tuck;
        if (state.dockEdge === 'top') state.y = -tuck;
        if (state.dockEdge === 'bottom') state.y = vh - size + tuck;
      } else {
        state.x = Math.max(6, Math.min(vw - size - 6, state.x));
        state.y = Math.max(54, Math.min(vh - size - 6, state.y));
      }

      gimbalEl.style.transform = `translate3d(${Math.round(state.x)}px, ${Math.round(state.y)}px, 0)`;
    }

    // Tiny top-right corner socket: tap to recall Gimbal to center-right or nest it into the corner
    cornerNestEl.addEventListener('click', () => {
      if (state.minimized || state.nestedInCorner) {
        // Recall & expand right below the corner in easy thumb reach
        state.minimized = false;
        state.nestedInCorner = false;
        state.dockEdge = 'none';
        state.x = Math.max(10, window.innerWidth - 332);
        state.y = 66;
      } else {
        // Nest it neatly into the top-right corner socket as the tiny orb
        state.minimized = true;
        state.nestedInCorner = true;
        state.dockEdge = 'none';
      }
      clampAndPlace(true);
      saveState();
    });

    // =====================================================
    // UNIFIED RING SPIN & CORE DRAG INTERACTION
    // =====================================================
    let activeMode = null; // 'ring' | 'move'
    let activeRingKey = null;
    let startPointerAngle = 0;
    let startRingAngle = 0;
    let dragMoved = false;
    let dragOffset = { x: 0, y: 0 };
    let dragStartPos = { x: 0, y: 0 };
    let lastTapTime = 0;

    function getAngleFromCenter(clientX, clientY) {
      const rect = svgEl.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      return Math.atan2(clientY - cy, clientX - cx) * 180 / Math.PI;
    }

    [ringOuterEl, ringMiddleEl, ringInnerEl].forEach(groupEl => {
      groupEl.addEventListener('pointerdown', e => {
        if (state.minimized) return;
        e.stopPropagation();
        activeMode = 'ring';
        activeRingKey = groupEl.dataset.ring;
        dragMoved = false;
        startPointerAngle = getAngleFromCenter(e.clientX, e.clientY);
        startRingAngle = state.angles[activeRingKey];
        groupEl.setPointerCapture(e.pointerId);
      });

      groupEl.addEventListener('pointermove', e => {
        if (activeMode !== 'ring' || activeRingKey !== groupEl.dataset.ring) return;
        const currentAngle = getAngleFromCenter(e.clientX, e.clientY);
        let delta = currentAngle - startPointerAngle;
        if (delta > 180) delta -= 360;
        if (delta < -180) delta += 360;
        if (Math.abs(delta) > 2) dragMoved = true;
        state.angles[activeRingKey] = startRingAngle + delta;
        applyRingTransforms();
        syncRingHighlights();
      });

      const endSpin = e => {
        if (activeMode !== 'ring' || activeRingKey !== groupEl.dataset.ring) return;
        if (!dragMoved) {
          const sec = e.target.closest('.sector-group');
          if (sec) {
            const idx = Number(sec.dataset.index);
            state.angles[activeRingKey] = -idx * RING_CONFIG[activeRingKey].step;
          }
        }
        snapRing(activeRingKey);
        activeMode = null;
        activeRingKey = null;
      };

      groupEl.addEventListener('pointerup', endSpin);
      groupEl.addEventListener('pointercancel', endSpin);
    });

    function beginMove(e, targetEl) {
      e.stopPropagation();
      activeMode = 'move';
      dragMoved = false;
      state.nestedInCorner = false;
      const rect = gimbalEl.getBoundingClientRect();
      dragOffset.x = e.clientX - rect.left;
      dragOffset.y = e.clientY - rect.top;
      dragStartPos = { x: e.clientX, y: e.clientY };
      targetEl.setPointerCapture(e.pointerId);
    }

    function moveGimbal(e) {
      if (activeMode !== 'move') return;
      if (Math.hypot(e.clientX - dragStartPos.x, e.clientY - dragStartPos.y) > 5) {
        dragMoved = true;
      }
      state.dockEdge = 'none';
      state.x = e.clientX - dragOffset.x;
      state.y = e.clientY - dragOffset.y;
      gimbalEl.style.transform = `translate3d(${Math.round(state.x)}px, ${Math.round(state.y)}px, 0)`;
    }

    function endMove(e, fromOrb) {
      if (activeMode !== 'move') return;
      activeMode = null;

      if (!dragMoved) {
        if (fromOrb) {
          // Tap on minimized orb -> expand right on screen
          state.minimized = false;
          state.dockEdge = 'none';
          state.nestedInCorner = false;
          clampAndPlace(true);
          saveState();
          return;
        } else {
          // Double-tap on center core -> minimize into orb
          const now = performance.now();
          if (now - lastTapTime < 320) {
            state.minimized = true;
            clampAndPlace(true);
            saveState();
            lastTapTime = 0;
            return;
          }
          lastTapTime = now;
        }
      }

      // Check if dragged near the top-right corner nest socket
      const nestRect = cornerNestEl.getBoundingClientRect();
      const size = state.minimized ? 68 : 320;
      const cx = state.x + size / 2;
      const cy = state.y + size / 2;
      if (Math.hypot(cx - (nestRect.left + 19), cy - (nestRect.top + 19)) < 75) {
        state.minimized = true;
        state.nestedInCorner = true;
        state.dockEdge = 'none';
        clampAndPlace(true);
        saveState();
        return;
      }

      // Check magnetic screen edges
      const vw = window.innerWidth;
      const vh = window.innerHeight;
      const edgeDist = 48;
      if (cx < edgeDist) { state.minimized = true; state.dockEdge = 'left'; }
      else if (cx > vw - edgeDist) { state.minimized = true; state.dockEdge = 'right'; }
      else if (cy < edgeDist) { state.minimized = true; state.dockEdge = 'top'; }
      else if (cy > vh - edgeDist) { state.minimized = true; state.dockEdge = 'bottom'; }

      clampAndPlace(true);
      saveState();
    }

    coreEl.addEventListener('pointerdown', e => beginMove(e, coreEl));
    coreEl.addEventListener('pointermove', moveGimbal);
    coreEl.addEventListener('pointerup', e => endMove(e, false));
    coreEl.addEventListener('pointercancel', e => endMove(e, false));

    orbEl.addEventListener('pointerdown', e => beginMove(e, orbEl));
    orbEl.addEventListener('pointermove', moveGimbal);
    orbEl.addEventListener('pointerup', e => endMove(e, true));
    orbEl.addEventListener('pointercancel', e => endMove(e, true));

    // =====================================================
    // PAGE RENDERING (ARTICLE, SIDEBAR TREE, SEARCH, MATRIX)
    // =====================================================
    function selectCoordinate(cIdx, tIdx, qIdx, syncWheel = true) {
      state.selected = { cat: cIdx, topic: tIdx, q: qIdx };
      if (syncWheel) {
        state.angles.outer = -cIdx * RING_CONFIG.outer.step;
        state.angles.middle = -tIdx * RING_CONFIG.middle.step;
        state.angles.inner = -qIdx * RING_CONFIG.inner.step;
        applyRingTransforms();
        syncRingHighlights();
      }
      renderArticle(cIdx, tIdx, qIdx, true);
      saveState();
    }

    function renderArticle(cIdx, tIdx, qIdx, updateHash = true) {
      const cat = CATEGORIES[cIdx];
      const topic = cat.topics[tIdx];
      const item = topic.questions[qIdx];
      const coordCode = `${cat.code} · ${topic.code} · Q${qIdx + 1}`;

      document.getElementById('crumbCat').textContent = `${cat.code} ${cat.short}`;
      document.getElementById('crumbTopic').textContent = `${topic.code} ${topic.short}`;
      document.getElementById('crumbQ').textContent = `Q${qIdx + 1}`;

      document.getElementById('artCoord').textContent = coordCode;
      document.getElementById('artPath').textContent = `${cat.name} // ${topic.name}`;
      document.getElementById('artTitle').textContent = item.q;
      document.getElementById('artTldr').textContent = item.tldr;
      document.getElementById('artBody').innerHTML = item.body;
      document.getElementById('artBad').textContent = item.bad;
      document.getElementById('artGood').textContent = item.good;

      // Sibling Q1..Q5 buttons
      const sibRow = document.getElementById('siblingRow');
      sibRow.innerHTML = '';
      topic.questions.forEach((sq, idx) => {
        const btn = document.createElement('button');
        btn.className = 'sib-btn' + (idx === qIdx ? ' active' : '');
        btn.textContent = `Q${idx + 1}: ${sq.q.slice(0, 32)}...`;
        btn.onclick = () => selectCoordinate(cIdx, tIdx, idx, true);
        sibRow.appendChild(btn);
      });

      renderSidebarTree(cIdx, tIdx, qIdx);
      renderMatrix(cIdx, tIdx);

      if (updateHash) {
        history.replaceState(null, '', `#C${cIdx + 1}-T${tIdx + 1}-Q${qIdx + 1}`);
      }
    }

    function renderSidebarTree(activeC, activeT, activeQ) {
      const wrap = document.getElementById('sidebarTree');
      wrap.innerHTML = '';
      CATEGORIES.forEach((cat, cIdx) => {
        const catDiv = document.createElement('div');
        catDiv.className = 'tree-cat' + (cIdx === activeC ? ' open' : '');

        const btn = document.createElement('button');
        btn.className = 'tree-cat-btn' + (cIdx === activeC ? ' active' : '');
        btn.innerHTML = `<span><span class="tree-cat-code">${cat.code}</span>${cat.name}</span><span>▾</span>`;
        btn.onclick = () => {
          catDiv.classList.toggle('open');
          selectCoordinate(cIdx, 0, 0, true);
        };

        const topicsDiv = document.createElement('div');
        topicsDiv.className = 'tree-topics';
        cat.topics.forEach((t, tIdx) => {
          const lbl = document.createElement('span');
          lbl.className = 'tree-topic-label';
          lbl.textContent = `${t.code} // ${t.name}`;
          topicsDiv.appendChild(lbl);

          t.questions.forEach((qObj, qIdx) => {
            const qBtn = document.createElement('button');
            const isAct = (cIdx === activeC && tIdx === activeT && qIdx === activeQ);
            qBtn.className = 'tree-q-btn' + (isAct ? ' active' : '');
            qBtn.innerHTML = `<span style="color:var(--pink-soft);font-family:monospace;">Q${qIdx + 1}</span><span>${qObj.q}</span>`;
            qBtn.onclick = () => {
              selectCoordinate(cIdx, tIdx, qIdx, true);
              document.getElementById('sidebar').classList.remove('open');
            };
            topicsDiv.appendChild(qBtn);
          });
        });

        catDiv.appendChild(btn);
        catDiv.appendChild(topicsDiv);
        wrap.appendChild(catDiv);
      });
    }

    function renderMatrix(activeC, activeT) {
      const grid = document.getElementById('matrixGrid');
      grid.innerHTML = '';
      CATEGORIES.forEach((cat, cIdx) => {
        cat.topics.forEach((t, tIdx) => {
          const card = document.createElement('div');
          card.className = 'matrix-card' + (cIdx === activeC && tIdx === activeT ? ' active' : '');
          card.innerHTML = `
            <div class="matrix-card-head">${cat.code} · ${t.code} // ${cat.short}</div>
            <div class="matrix-card-name">${t.name}</div>
          `;
          card.onclick = () => {
            selectCoordinate(cIdx, tIdx, 0, true);
            window.scrollTo({ top: 0, behavior: 'smooth' });
          };
          grid.appendChild(card);
        });
      });
    }

    // Instant Search
    const searchInput = document.getElementById('searchInput');
    const searchClear = document.getElementById('searchClear');
    const searchResults = document.getElementById('searchResults');

    searchInput.addEventListener('input', () => {
      const q = searchInput.value.trim().toLowerCase();
      searchClear.style.display = q ? 'block' : 'none';
      if (!q) {
        searchResults.classList.remove('visible');
        return;
      }
      const hits = [];
      CATEGORIES.forEach((cat, cIdx) => {
        cat.topics.forEach((t, tIdx) => {
          t.questions.forEach((item, qIdx) => {
            const hay = `${cat.name} ${t.name} ${item.q} ${item.tldr} ${item.body}`.toLowerCase();
            if (hay.includes(q)) hits.push({ cIdx, tIdx, qIdx, cat, t, item });
          });
        });
      });

      searchResults.classList.add('visible');
      if (!hits.length) {
        searchResults.innerHTML = `<div style="font-size:0.82rem;color:var(--muted);">No matches for "${q}".</div>`;
        return;
      }
      searchResults.innerHTML = `<div style="font-family:monospace;font-size:0.74rem;color:var(--cyan);margin-bottom:8px;">${hits.length} MATCHING NODES</div>` +
        hits.slice(0, 10).map(h => `
          <div style="padding:8px;border-bottom:1px solid rgba(255,0,127,0.15);cursor:pointer;" onclick="window._jumpSearch(${h.cIdx},${h.tIdx},${h.qIdx})">
            <div style="font-family:monospace;font-size:0.68rem;color:var(--pink-soft);">${h.cat.code}·${h.t.code}·Q${h.qIdx + 1} // ${h.t.name}</div>
            <div style="font-size:0.84rem;color:#fff;font-weight:600;">${h.item.q}</div>
          </div>
        `).join('');
    });

    window._jumpSearch = (c, t, q) => {
      searchInput.value = '';
      searchClear.style.display = 'none';
      searchResults.classList.remove('visible');
      selectCoordinate(c, t, q, true);
    };

    searchClear.onclick = () => {
      searchInput.value = '';
      searchClear.style.display = 'none';
      searchResults.classList.remove('visible');
    };

    document.getElementById('mobileTreeBtn').onclick = () => {
      document.getElementById('sidebar').classList.toggle('open');
    };

    document.getElementById('crumbCat').onclick = () => {
      const nextC = (state.selected.cat + 1) % 5;
      selectCoordinate(nextC, 0, 0, true);
    };
    document.getElementById('crumbTopic').onclick = () => {
      const nextT = (state.selected.topic + 1) % 3;
      selectCoordinate(state.selected.cat, nextT, 0, true);
    };

    window.addEventListener('resize', () => clampAndPlace(false));

    // =====================================================
    // INIT
    // =====================================================
    loadState();
    const hashMatch = location.hash.match(/^#C([1-5])-T([1-3])-Q([1-5])$/i);
    if (hashMatch) {
      state.selected = {
        cat: Number(hashMatch[1]) - 1,
        topic: Number(hashMatch[2]) - 1,
        q: Number(hashMatch[3]) - 1
      };
    }
    state.angles.outer = -state.selected.cat * RING_CONFIG.outer.step;
    state.angles.middle = -state.selected.topic * RING_CONFIG.middle.step;
    state.angles.inner = -state.selected.q * RING_CONFIG.inner.step;

    buildAllRings();
    applyRingTransforms();
    syncRingHighlights();
    renderArticle(state.selected.cat, state.selected.topic, state.selected.q, false);
    clampAndPlace(false);
  </script>
</body>
</html>
