<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Linkin.Love FAQ // Sugar Pe♥nies</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000000;
      --surface: #050507;
      --card: #08080c;
      --pink: #ff007f;
      --pink-hot: #ff1493;
      --pink-soft: #ff66b2;
      --pink-glow: rgba(255, 0, 127, 0.45);
      --cyan: #00f0ff;
      --cyan-glow: rgba(0, 240, 255, 0.42);
      --text: #fff0f6;
      --muted: #b894a6;
      --dim: #6e4c5e;
      --border: rgba(255, 0, 127, 0.24);
      --spring: cubic-bezier(0.22, 1.25, 0.36, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-image:
        radial-gradient(circle at 18% 8%, rgba(255, 0, 127, 0.11) 0%, transparent 48%),
        radial-gradient(circle at 82% 88%, rgba(0, 240, 255, 0.06) 0%, transparent 45%);
      overflow-x: hidden;
      padding-bottom: 110px;
    }

    /* COMPACT DIRECTORY BAR + TINY TOP-RIGHT NEST SOCKET */
    .directory-strip {
      position: sticky;
      top: 0;
      z-index: 150;
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 0, 127, 0.2);
      padding: 8px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .dir-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      flex: 1;
    }

    .mobile-tree-btn {
      display: none;
      background: rgba(255, 0, 127, 0.1);
      border: 1px solid var(--pink);
      color: var(--text);
      border-radius: 6px;
      padding: 5px 9px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      cursor: pointer;
      flex-shrink: 0;
    }

    .crumbs {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.74rem;
      color: var(--muted);
      min-width: 0;
    }

    .crumbs a {
      color: var(--muted);
      text-decoration: none;
      transition: color 0.15s;
    }
    .crumbs a:hover { color: #fff; text-shadow: 0 0 8px var(--pink); }
    .crumbs .sep { color: var(--dim); }
    .crumbs .crumb-btn {
      background: rgba(255, 0, 127, 0.09);
      border: 1px solid rgba(255, 0, 127, 0.25);
      color: var(--pink-soft);
      padding: 2px 7px;
      border-radius: 5px;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.71rem;
    }
    .crumbs .crumb-btn.cyan {
      color: var(--cyan);
      border-color: rgba(0, 240, 255, 0.3);
      background: rgba(0, 240, 255, 0.08);
    }

    /* TINY CORNER NEST / RECALL SOCKET */
    .corner-nest {
      position: relative;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px dashed rgba(0, 240, 255, 0.45);
      background: radial-gradient(circle, rgba(0, 240, 255, 0.12), rgba(255, 0, 127, 0.08));
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      box-shadow: 0 0 12px rgba(0, 240, 255, 0.18);
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
    }
    .corner-nest:hover {
      transform: scale(1.08);
      border-color: var(--pink);
      box-shadow: 0 0 16px var(--pink-glow);
    }
    .corner-nest::after {
      content: '';
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 8px var(--cyan);
    }
    .corner-nest.nested::after {
      background: var(--pink);
      box-shadow: 0 0 10px var(--pink);
    }

    /* MAIN SHELL */
    .layout {
      max-width: 1320px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 290px 1fr;
      min-height: calc(100vh - 55px);
    }

    /* SIDEBAR DIRECTORY TREE */
    .sidebar {
      background: var(--surface);
      border-right: 1px solid rgba(255, 0, 127, 0.18);
      padding: 16px 12px 100px;
      position: sticky;
      top: 55px;
      height: calc(100vh - 55px);
      overflow-y: auto;
    }

    .search-wrap {
      position: relative;
      margin-bottom: 14px;
    }
    .search-input {
      width: 100%;
      background: #000;
      border: 1px solid rgba(255, 0, 127, 0.38);
      border-radius: 8px;
      padding: 9px 28px 9px 11px;
      color: #fff;
      font-size: 0.8rem;
      outline: none;
    }
    .search-input:focus {
      border-color: var(--pink);
      box-shadow: 0 0 12px rgba(255, 0, 127, 0.35);
    }
    .search-clear {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 0.85rem;
      display: none;
    }

    .tree-cat { margin-bottom: 8px; }
    .tree-cat-btn {
      width: 100%;
      text-align: left;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 0, 127, 0.14);
      color: var(--text);
      padding: 7px 9px;
      border-radius: 7px;
      font-family: 'Syne', sans-serif;
      font-size: 0.78rem;
      font-weight: 700;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }
    .tree-cat-btn.active {
      background: rgba(255, 0, 127, 0.13);
      border-color: var(--pink);
      box-shadow: 0 0 10px rgba(255, 0, 127, 0.2);
    }
    .tree-cat-code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.66rem;
      color: var(--pink-soft);
      margin-right: 6px;
    }
    .tree-topics {
      display: none;
      padding-left: 8px;
      margin-top: 5px;
      border-left: 1px dashed rgba(255, 0, 127, 0.25);
    }
    .tree-cat.open .tree-topics { display: block; }

    .tree-topic-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.66rem;
      color: var(--cyan);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 6px 6px 3px;
      display: block;
    }

    .tree-q-btn {
      width: 100%;
      text-align: left;
      background: transparent;
      border: none;
      color: var(--muted);
      padding: 5px 8px;
      border-radius: 5px;
      font-size: 0.74rem;
      cursor: pointer;
      display: flex;
      gap: 6px;
      align-items: baseline;
      line-height: 1.3;
    }
    .tree-q-btn:hover { color: #fff; background: rgba(255, 0, 127, 0.08); }
    .tree-q-btn.active {
      color: #fff;
      background: rgba(255, 0, 127, 0.2);
      border-left: 2px solid var(--pink);
      font-weight: 600;
    }

    /* CONTENT PANE */
    .content {
      padding: 24px 28px 80px;
      max-width: 880px;
    }

    .search-results {
      display: none;
      margin-bottom: 24px;
      background: var(--card);
      border: 1px solid var(--pink);
      border-radius: 12px;
      padding: 16px;
    }
    .search-results.visible { display: block; }

    .article-card {
      background: var(--card);
      border: 1px solid rgba(255, 0, 127, 0.32);
      border-radius: 14px;
      padding: 26px;
      box-shadow: 0 0 28px rgba(255, 0, 127, 0.1);
      margin-bottom: 24px;
    }

    .article-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-bottom: 12px;
    }
    .coord-pill {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      font-weight: 700;
      color: #fff;
      background: rgba(255, 0, 127, 0.2);
      border: 1px solid var(--pink);
      padding: 3px 9px;
      border-radius: 999px;
    }
    .topic-pill {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      color: var(--cyan);
      background: rgba(0, 240, 255, 0.08);
      border: 1px solid rgba(0, 240, 255, 0.3);
      padding: 3px 9px;
      border-radius: 999px;
    }

    .article-title {
      font-family: 'Syne', sans-serif;
      font-size: clamp(1.35rem, 3vw, 1.95rem);
      font-weight: 800;
      color: #fff;
      text-shadow: 0 0 12px rgba(255, 0, 127, 0.45);
      line-height: 1.2;
      margin-bottom: 16px;
    }

    .tldr-box {
      background: rgba(255, 0, 127, 0.07);
      border-left: 3px solid var(--pink);
      padding: 12px 15px;
      border-radius: 0 8px 8px 0;
      margin-bottom: 18px;
      font-size: 0.92rem;
      line-height: 1.55;
    }
    .tldr-box strong {
      color: var(--pink-soft);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.74rem;
      text-transform: uppercase;
      display: block;
      margin-bottom: 4px;
    }

    .article-body {
      color: #f3dce8;
      font-size: 0.94rem;
      line-height: 1.68;
    }
    .article-body p { margin-bottom: 14px; }

    .pattern-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 18px 0;
    }
    .pattern-box {
      background: #030305;
      border-radius: 9px;
      padding: 13px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.77rem;
      line-height: 1.5;
    }
    .pattern-box.bad { border-color: rgba(255, 50, 90, 0.4); }
    .pattern-box.good { border-color: rgba(0, 240, 255, 0.45); }
    .pattern-label {
      font-weight: 700;
      font-size: 0.69rem;
      text-transform: uppercase;
      margin-bottom: 6px;
      display: block;
    }
    .pattern-box.bad .pattern-label { color: #ff4d79; }
    .pattern-box.good .pattern-label { color: var(--cyan); }

    .sibling-row {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid rgba(255, 0, 127, 0.16);
    }
    .sib-btn {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 0, 127, 0.25);
      color: var(--muted);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.74rem;
      cursor: pointer;
      font-family: 'JetBrains Mono', monospace;
    }
    .sib-btn.active {
      background: rgba(255, 0, 127, 0.22);
      color: #fff;
      border-color: var(--pink);
      box-shadow: 0 0 10px rgba(255, 0, 127, 0.3);
    }

    /* TOC MATRIX CARDS */
    .matrix-title {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.74rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--pink-soft);
      margin-bottom: 10px;
    }
    .matrix-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 10px;
    }
    .matrix-card {
      background: var(--card);
      border: 1px solid rgba(255, 0, 127, 0.18);
      border-radius: 9px;
      padding: 11px;
      cursor: pointer;
      transition: border-color 0.15s, transform 0.15s;
    }
    .matrix-card:hover { border-color: var(--pink); transform: translateY(-2px); }
    .matrix-card.active { border-color: var(--cyan); box-shadow: 0 0 12px rgba(0, 240, 255, 0.18); }
    .matrix-card-head {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.68rem;
      color: var(--cyan);
      margin-bottom: 4px;
    }
    .matrix-card-name {
      font-weight: 700;
      font-size: 0.83rem;
      color: #fff;
    }

    /* =====================================================
       FLOATING 3-RING GIMBAL COMPANION
       ===================================================== */
    .gimbal-companion {
      position: fixed;
      left: 0;
      top: 0;
      width: 320px;
      height: 320px;
      z-index: 9999;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      will-change: transform;
      transition:
        width 0.36s var(--spring),
        height 0.36s var(--spring),
        filter 0.25s ease;
      filter: drop-shadow(0 14px 34px rgba(0, 0, 0, 0.85)) drop-shadow(0 0 18px rgba(255, 0, 127, 0.22));
    }

    .gimbal-companion.animating-pos {
      transition:
        transform 0.42s var(--spring),
        width 0.36s var(--spring),
        height 0.36s var(--spring);
    }

    .gimbal-companion.minimized {
      width: 68px;
      height: 68px;
    }

    .gimbal-expanded {
      position: relative;
      width: 100%;
      height: 100%;
      transition: opacity 0.22s ease, transform 0.32s var(--spring);
    }

    .gimbal-companion.minimized .gimbal-expanded {
      opacity: 0;
      transform: scale(0.28);
      pointer-events: none;
    }

    /* Sightline HUD badge floating above 12-o'clock */
    .gimbal-hud {
      position: absolute;
      top: -22px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.92);
      border: 1px solid var(--cyan);
      color: var(--cyan);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.66rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
      white-space: nowrap;
      pointer-events: none;
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.35);
    }

    .sightline-marker {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 7px solid transparent;
      border-right: 7px solid transparent;
      border-top: 11px solid var(--cyan);
      filter: drop-shadow(0 0 8px var(--cyan));
      z-index: 5;
      pointer-events: none;
    }

    .sightline-beam {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 2px;
      height: 112px;
      background: linear-gradient(to bottom, rgba(0, 240, 255, 0.78), rgba(255, 0, 127, 0.05));
      border-radius: 999px;
      z-index: 4;
      pointer-events: none;
    }

    .gimbal-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
      display: block;
      touch-action: none;
    }

    .ring-group {
      cursor: grab;
      touch-action: none;
    }
    .ring-group:active {
      cursor: grabbing;
    }

    .sector-path {
      fill: rgba(10, 10, 16, 0.9);
      stroke: rgba(255, 0, 127, 0.25);
      stroke-width: 1.2;
      transition: fill 0.16s ease, stroke 0.16s ease;
    }

    .sector-group.active .sector-path {
      fill: rgba(255, 0, 127, 0.34);
      stroke: var(--pink);
      stroke-width: 2;
      filter: drop-shadow(0 0 8px var(--pink-glow));
    }

    .sector-label {
      fill: #b894a6;
      font-size: 9.5px;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      text-anchor: middle;
      dominant-baseline: middle;
      pointer-events: none;
    }
    .sector-group.active .sector-label {
      fill: #ffffff;
    }

    /* Center core drag handle */
    .gimbal-core {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 78px;
      height: 78px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(circle at 32% 28%, #1a0814, #050508 75%);
      border: 1.5px solid var(--pink);
      box-shadow:
        inset 0 0 12px rgba(255, 0, 127, 0.35),
        0 0 16px rgba(255, 0, 127, 0.3);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: move;
      z-index: 6;
      text-align: center;
      padding: 4px;
      touch-action: none;
    }

    .core-coord {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.68rem;
      font-weight: 800;
      color: #fff;
      text-shadow: 0 0 6px var(--pink);
    }
    .core-sub {
      font-size: 0.54rem;
      color: var(--cyan);
      font-family: 'JetBrains Mono', monospace;
      margin-top: 2px;
    }

    /* Minimized Orb Companion */
    .gimbal-orb {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background:
        radial-gradient(circle at 30% 28%, rgba(0, 240, 255, 0.35), rgba(255, 0, 127, 0.3) 45%, #06060a 80%);
      border: 2px solid var(--pink);
      box-shadow:
        0 8px 24px rgba(0, 0, 0, 0.8),
        0 0 18px var(--pink-glow),
        inset 0 0 12px rgba(0, 240, 255, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: grab;
      opacity: 0;
      transform: scale(0.4);
      pointer-events: none;
      transition: opacity 0.24s ease, transform 0.34s var(--spring), border-color 0.2s;
      touch-action: none;
    }

    .gimbal-companion.minimized .gimbal-orb {
      opacity: 1;
      transform: scale(1);
      pointer-events: auto;
    }

    .orb-eyes {
      display: flex;
      gap: 7px;
      align-items: center;
      justify-content: center;
      transition: transform 0.25s ease;
    }
    .orb-eye {
      width: 6px;
      height: 11px;
      border-radius: 999px;
      background: var(--cyan);
      box-shadow: 0 0 8px var(--cyan);
      animation: blink 4.2s infinite;
    }
    @keyframes blink {
      0%, 92%, 100% { transform: scaleY(1); }
      95% { transform: scaleY(0.12); }
    }

    .gimbal-companion.minimized[data-dock="left"] .orb-eyes { transform: translateX(10px); }
    .gimbal-companion.minimized[data-dock="right"] .orb-eyes { transform: translateX(-10px); }
    .gimbal-companion.minimized[data-dock="top"] .orb-eyes { transform: translateY(10px); }
    .gimbal-companion.minimized[data-dock="bottom"] .orb-eyes { transform: translateY(-10px); }

    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; }
      .mobile-tree-btn { display: inline-block; }
      .sidebar {
        position: fixed;
        left: 0;
        top: 52px;
        width: 285px;
        z-index: 300;
        transform: translateX(-105%);
        transition: transform 0.25s ease;
        box-shadow: 12px 0 30px rgba(0, 0, 0, 0.9);
      }
      .sidebar.open { transform: translateX(0); }
      .pattern-grid { grid-template-columns: 1fr; }
      .content { padding: 18px 14px 90px; }
    }
  </style>
</head>
<body>

  <!-- SLIM DIRECTORY BAR + TINY TOP-RIGHT NEST SOCKET -->
  <div class="directory-strip">
    <div class="dir-left">
      <button class="mobile-tree-btn" id="mobileTreeBtn">☰ Tree</button>
      <nav class="crumbs" id="breadcrumbBar">
        <a href="../">Sugar Pe♥nies</a>
        <span class="sep">/</span>
        <span style="color:#fff;font-weight:700;">Linkin.Love FAQ</span>
        <span class="sep">/</span>
        <button class="crumb-btn" id="crumbCat">C1</button>
        <span class="sep">›</span>
        <button class="crumb-btn cyan" id="crumbTopic">T1</button>
        <span class="sep">›</span>
        <span id="crumbQ" style="color:#fff;">Q1</span>
      </nav>
    </div>

    <!-- Tiny Top-Right Nest / Recall Socket -->
    <div class="corner-nest" id="cornerNest" title="Tap to recall or nest Gimbal here"></div>
  </div>

  <div class="layout">
    <!-- LEFT SIDEBAR TREE -->
    <aside class="sidebar" id="sidebar">
      <div class="search-wrap">
        <input type="text" class="search-input" id="searchInput" placeholder="Search 75 FAQ nodes..." />
        <button class="search-clear" id="searchClear">✕</button>
      </div>
      <div id="sidebarTree"></div>
    </aside>

    <!-- MAIN ARTICLE VIEW -->
    <main class="content">
      <div class="search-results" id="searchResults"></div>

      <article class="article-card" id="articleCard">
        <div class="article-meta">
          <span class="coord-pill" id="artCoord">C1 · T1 · Q1</span>
          <span class="topic-pill" id="artPath">Card Architecture // Positive Displacement</span>
        </div>
        <h1 class="article-title" id="artTitle">Loading...</h1>
        <div class="tldr-box">
          <strong>⚡ Fast Answer // TL;DR</strong>
          <span id="artTldr"></span>
        </div>
        <div class="article-body" id="artBody"></div>
        <div class="pattern-grid">
          <div class="pattern-box bad">
            <span class="pattern-label">✕ Fragile / Broken Pattern</span>
            <div id="artBad"></div>
          </div>
          <div class="pattern-box good">
            <span class="pattern-label">✓ Linkin.Love Architecture</span>
            <div id="artGood"></div>
          </div>
        </div>
        <div class="sibling-row" id="siblingRow"></div>
      </article>

      <div class="matrix-title">Category Topic Matrix (15 Branches)</div>
      <div class="matrix-grid" id="matrixGrid"></div>
    </main>
  </div>

  <!-- FLOATING 3-RING GIMBAL COMPANION -->
  <div class="gimbal-companion" id="gimbal" data-dock="none">
    <div class="gimbal-expanded">
      <div class="gimbal-hud" id="gimbalHud">C1 · T1 · Q1</div>
      <div class="sightline-marker"></div>
      <div class="sightline-beam"></div>
